apiVersion: v1
kind: Secret
metadata:
  name: klio-client
stringData:
  klio.yaml: |-
    client:
      wal:
        address: klio-server:52000
        cluster_name: cluster-example
        server_cert_path: /klio-server-tls/tls.crt
        username: klio@cluster-example
        password: thispassword
      base:
        base_url: https://klio-server:51515
        hostname: cluster-example
        username: klio@cluster-example
        password: thispassword
        server_cert_path: /klio-server-tls/tls.crt

    source:
      dsn: user=postgres replication=yes application_name=klio
      standard_dsn: user=postgres application_name=klio
      slot: klio
      

    .guide    { stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 3 4; fill: none; }
    .guideGone{ stroke: #e8edf3; stroke-width: 1.4; stroke-dasharray: 3 4; fill: none; }
    .divider  { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 2 4; }
    .cap      { font: 400 12px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif; fill: #334155; }

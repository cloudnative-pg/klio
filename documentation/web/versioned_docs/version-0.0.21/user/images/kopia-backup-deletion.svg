    .gone     { font: 600 11px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif; fill: #94a3b8; }
    .freed    { font: 600 11px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif; fill: #b91c1c; }
    .cell     { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }

  <title
     id="delTitle">Removing a backup frees only the contents nothing else references</title>
  <desc
     id="delDesc">The same three base backups, with backup 1 removed and shown
  greyed out. Contents A and B are still referenced by backups 2 and 3, content
  D by backups 2 and 3, and content E by backup 3, so all four remain in the
  repository. Content C was referenced only by backup 1, so nothing references
  it any more and it can be reclaimed. Removing one backup out of three
  therefore frees one content out of five.</desc>

  <title
     id="ddTitle">Deduplication across three base backups</title>
  <desc
     id="ddDesc">Three base backups of the same PostgreSQL cluster, shown as
  rows, with one column per distinct content. Backup 1 contains chunks A, B and
  C. In backup 2 the third chunk has changed, so it contains A, B and the new
  chunk D. Backup 3 contains A, B, D and a further new chunk E. Chunks in the
  same column are byte-identical and share one content ID, so the ten chunk
  references across the three backups resolve to only five stored contents:
  A referenced three times, B three times, C once, D twice and E once.</desc>

    .cell     { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }
    .cellNew  { fill: #fde68a; stroke: #d97706; stroke-width: 1.6; }
    .store    { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
    .ctext    { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .guide    { stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 3 4; fill: none; }
    .divider  { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 2 4; }
    .cap      { font: 400 12px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif; fill: #334155; }

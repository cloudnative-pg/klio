matrix:
- name: Markdown
  sources:
  # Ignore the CHANGELOG.md file, it is autogenerated
  - ./**/*.md|!./CHANGELOG.md|!./web/node_modules/**/*.md|!./web/versioned_docs/**/*.md
  - ./**/*.mdx|!./web/node_modules/**/*.mdx|!./web/versioned_docs/**/*.mdx
  dictionary:
    wordlists:
    - .wordlist.txt
  aspell:
    lang: en
    d: en_US
  pipeline:
  - pyspelling.filters.context:
      context_visible_first: true
      delimiters:
        # Ignore multiline content between fences (fences can have 3 or more back ticks)
        # ```
        # content
        # ```
        - open: '(?s)^(?P<open> *`{3,})'
          close: '^(?P=open)$'
        # Ignore lines included between HTML comments
        # <!-- spell-checker-disable -->
        # content
        # <!-- spell-checker-enable -->
        - open: '(?s)<!--\s*spell-checker-disable\s*-->'
          close: '<!--\s*spell-checker-enable\s*-->'
  - pyspelling.filters.markdown:
  - pyspelling.filters.html:
      ignores:
          - ':matches(code, pre)'
          - 'code'
          - 'pre'

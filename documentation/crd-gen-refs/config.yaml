processor:
  ignoreGroupVersions:
    - "GVK"
  customMarkers:
    - name: "optional"
      target: field
  ignoreFields:
#    - "status$"
    - "TypeMeta$"
  ignoreTypes:
    - "ServerList$"
    - "PluginConfigurationList$"
    - "RecoverySource$"
    - "RecoverySourceList$"
    - "RecoverySourceSpec$"
    - "RecoverySourceStorageConfiguration$"

render:
  # Version of Kubernetes to use when generating links to Kubernetes API documentation.
  # renovate: datasource=github-releases depName=kubernetes/kubernetes versioning=loose extractVersion=^v(?<version>\d+\.\d+)\.\d+$
  kubernetesVersion: 1.35

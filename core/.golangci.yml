version: "2"
linters:
  default: all
  disable:
    - mnd
    - depguard
    - exhaustruct
    - funlen
    - paralleltest
    - testpackage
    - wsl
    - err113
    - wrapcheck
    - varnamelen
    - nilnil
    - godox
  settings:
    lll:
      line-length: 120
    nlreturn:
      block-size: 3
    varnamelen:
      ignore-decls:
        - g Gomega
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        text: should not use dot imports
        source: ginkgo|gomega
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - lll
        source: //\s*\+
    paths:
      - zz_generated.*
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/cloudnative-pg/klio)
        - blank
        - dot
  exclusions:
    generated: lax
    paths:
      - zz_generated.*
      - third_party$
      - builtin$
      - examples$

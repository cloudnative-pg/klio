syntax = "proto3";

package klio.wal.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/cloudnative-pg/klio/core/internal/grpc";

service Admin {
  // Invoked to refresh the policies and the cache of the Kopia server
  rpc Refresh(RefreshRequest) returns (RefreshResult) {}

  // List every backup on the server
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResult) {}

  // List backups failed to be processed from the queue
  rpc QueueListFailedBackups(QueueListFailedBackupsRequest) returns (QueueListFailedBackupsResponse) {}

  // List WAL files failed to be processed from the queue
  rpc QueueListFailedWALs(QueueListFailedWALsRequest) returns (QueueListFailedWALsResponse) {}

  // Retry WAL files that failed to be processed from the queue
  rpc QueueRetryWALs(QueueRetryWALsRequest) returns (QueueRetryResponse) {}

  // Retry Backups that failed to be processed from the queue
  rpc QueueRetryBackups(QueueRetryBackupsRequest) returns (QueueRetryResponse) {}

  // Get the status of the task queue (pending backups and WALs)
  rpc QueueStatus(QueueStatusRequest) returns (QueueStatusResponse) {}

  // Delete a backup from the server
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse) {}
}

message RefreshRequest{
}

message RefreshResult{
}

message ListBackupsRequest {
}

message ListBackupsResult {
  // JSON-serialized array of backup manifests.
  // Each manifest contains fields like:
  //   - id: string
  //   - cluster_name: string
  //   - timestamp: RFC3339 string
  //   - size_bytes: number
  // See klioclient.BackupManifest for the canonical structure.
  // We use JSON bytes here to avoid duplicating the internal type definition
  // and conversion logic, as this is a local admin API.
  bytes backup_manifests = 1;
}

message QueueListFailedBackupsRequest {
  optional string cluster_name = 1;
}

message QueueListFailedBackupsResponse {
  repeated FailedBackup backups = 1;
}

message QueueListFailedWALsRequest {
  optional string cluster_name = 1;
}

message QueueListFailedWALsResponse {
  repeated FailedWAL wals = 1;
}

message FailedBackup {
  string cluster_name = 1;
  google.protobuf.Timestamp last_attempt_time = 2;
}

message FailedWAL {
  string cluster_name = 1;
  string wal_name = 2;
  uint64 sequence = 3;
  google.protobuf.Timestamp last_attempt_time = 4;
}

message QueueRetryWALsRequest {
  optional string cluster_name = 1;
  repeated string wal_names = 2;
}

message QueueRetryBackupsRequest {
  optional string cluster_name = 1;
}

message QueueRetryResponse {
}

message QueueStatusRequest {
}

message QueueStatusResponse {
  // Number of backup synchronization tasks pending in the queue
  uint64 pending_backups = 1;

  // Number of WAL relay tasks pending in the queue
  uint64 pending_wals = 2;
}

// Tier represents a storage tier in the backup system.
enum Tier {
  // TIER_UNSPECIFIED is the default value and should not be used.
  TIER_UNSPECIFIED = 0;

  // TIER_1 represents the local cache storage.
  TIER_1 = 1;

  // TIER_2 represents the object storage.
  TIER_2 = 2;
}

// DeleteBackupRequest is the request to delete a backup from the server.
message DeleteBackupRequest {
  // The name of the backup to delete.
  string backup_name = 1;

  // The storage tiers from which to delete the backup.
  // At least one tier must be specified.
  repeated Tier tiers = 2;

  // The name of the cluster that owns the backup.
  string cluster_name = 3;
}

// DeleteBackupResponse is the response to a backup deletion request.
message DeleteBackupResponse {
}

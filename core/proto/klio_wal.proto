syntax = "proto3";

package klio.wal.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/cloudnative-pg/klio/core/internal/grpc";

service WAL {
  rpc Put(stream PutRequest) returns (PutResult) {}
  rpc Get(GetRequest) returns (stream GetResult) {}

  rpc GetMetadata(GetMetadataRequest) returns (ClusterMetadata) {}
  rpc RequestWALStart(RequestWALStartRequest) returns (RequestWALStartResult) {}
  rpc ResetWALStream(ResetWALStreamRequest) returns (ResetWALStreamResult) {}

  rpc CloseBackup(CloseBackupRequest) returns (CloseBackupResult) {}
}

message PutRequest {
  string cluster_name = 1;
  string wal_name = 2;
  bytes wal_block = 3;
  uint64 segment_size = 4;

  reserved 5, 6; // was trace_id, span_id
  reserved "trace_id", "span_id";

  bool send_to_tier2 = 7;
}

message PutResult {
  uint64 written_size = 1;
}

message GetMetadataRequest {
  string cluster_name = 1;
}

message GetRequest {
  string cluster_name = 1;
  string wal_name = 2;
}

message GetResult {
  bytes wal_block = 1;
  uint64 segment_size = 2;
}

message RequestWALStartRequest {
  // This is the cluster name
  string cluster_name = 1;

  // This is the system ID
  string system_id = 2;

  // This is the current WAL name that is being written
  // by PostgreSQL. If empty, the start WAL name will be
  // found by looking at the stored WAL files.
  string current_wal_name = 3;
}

message RequestWALStartResult {
  // The WAL file where the client is expected to start
  // streaming.
  string wal_name = 1;
}

message ResetWALStreamRequest {
  // This is the cluster name
  string cluster_name = 1;

  // This is the system ID
  string system_id = 2;

  // This is the current WAL name that is being written
  // by PostgreSQL. If empty, the start WAL name will be
  // found by looking at the stored WAL files.
  string current_wal_name = 3;
}

message ResetWALStreamResult {
  // The WAL file where the client is expected to start
  // streaming.
  string wal_name = 1;
}

// The following messages are written in the cluster metadata
// file
message ClusterMetadata {
  // The system ID of the current cluster
  string system_id = 1;

  // The gaps we are aware of in the collected WALs.
  repeated WALGap gaps = 2;
}

// WALGap is a know gap in the WAL collection process.
// This is usually caused by an invocation of the reset-lsn Klio
// feature.
message WALGap {
  // When this gap was detected and created.
  google.protobuf.Timestamp ts = 1;

  // When the gap started.
  string start = 2;

  // When the gap ends.
  string end = 3;
}

// The following messages are used to write a WAL file
// in the Klio WAL Storage area
message StartWALFile {
  uint64 klio_version = 1;
  uint64 file_length = 2;
}

// This is sent to the WAL server every time a backup has
// been completed.
message CloseBackupRequest {
  // The name of the cluster.
  string cluster_name = 1;

  // The name of the backup.
  string backup_name = 3;

  // The backup timeline
  int32 timeline = 4;

  // the first WAL required to restore this backup.
  string start_wal = 5;

  // The last WAL required to restore this backup.
  string end_wal = 6;

  // The size of a WAL segment. Needed to generate
  // the sequence of WAL files between the start and the end.
  uint64 segment_size = 7;

  // Require this backup to be sent to tier2.
  bool send_to_tier2 = 8;

  // When present, set the tier2 retention policy to the specified JSON-serialized policy.
  string tier2_retention_policy = 9;

  // When present, set the tier2 compression policy to the specified JSON-serialized policy.
  string tier2_compression_policy = 10;
}

// This is sent by the WAL server in response to a CloseBackupRequest
// message.
message CloseBackupResult {
  // True when the backup has been scheduled to be synchronized
  // to tier2 storage
  bool tier2_schedule = 1;

  // List of WAL files needed by this backup but still not
  // uploaded to tier1
  repeated string missing_wal_files = 2;
}

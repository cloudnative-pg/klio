linters-settings:
  lll:
    line-length: 120
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/cloudnative-pg/klio)
      - blank
      - dot
  nlreturn:
    block-size: 3

linters:
  enable-all: true
  disable:
    - depguard
    - exhaustruct
    - funlen
    - mnd
    - paralleltest
    - perfsprint
    - tenv
    - testpackage
    - wsl

run:
  timeout: 10m

issues:
  exclude-rules:
    # Allow dot imports for ginkgo and gomega
    - source: ginkgo|gomega
      linters:
      - revive
      text: "should not use dot imports"
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - goconst
    # Exclude lll issues for lines with long annotations
    - linters:
      - lll
      source: "//\\s*\\+"
  exclude-use-default: false
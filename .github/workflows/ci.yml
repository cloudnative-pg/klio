name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  change-triage:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      docs-changed: ${{ steps.filter.outputs.docs-changed }}
      core-changed: ${{ steps.filter.outputs.core-changed }}
      operator-changed: ${{ steps.filter.outputs.operator-changed }}
      renovate-changed: ${{ steps.filter.outputs.renovate-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check for changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            docs-changed:
              - 'documentation/**'
              - 'core/proto/**/*.proto'
              - 'operator/api/**/*.go'
              - 'Taskfile.yml'
              - '.github/**'
            core-changed:
              - 'core/**'
              - 'Taskfile.yml'
              - '.github/**'
            operator-changed:
              - 'operator/**'
              - 'Taskfile.yml'
              - '.github/**'
            renovate-changed:
              - 'renovate.json'

  commitlint:
    name: Commit Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Run commitlint
        run: |
          task all:commitlint

  documentation:
    name: Documentation CI
    needs:
      - change-triage
    if: needs.change-triage.outputs.docs-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Run CI task
        run: |
          task documentation:ci

  core:
    name: Core CI
    needs:
      - change-triage
    if: needs.change-triage.outputs.core-changed == 'true'
    runs-on: ["edb", "2xlarge"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cleanup disk
        uses: ./.github/actions/cleanup-disk

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI task
        run: |
          task core:ci

      - name: Upload assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klio
          path: |
            core/dist/*.deb
            core/dist/*.rpm
            core/dist/*.tar.gz

  operator:
    name: Operator CI
    needs:
      - change-triage
    if: needs.change-triage.outputs.operator-changed == 'true'
    runs-on: ["edb", "2xlarge"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cleanup disk
        uses: ./.github/actions/cleanup-disk

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI task
        run: |
          task operator:ci

  integration-tests:
    name: Integration Tests
    needs:
      - change-triage
    if: needs.change-triage.outputs.core-changed == 'true' || needs.change-triage.outputs.operator-changed == 'true'
    runs-on: ["edb", "2xlarge"]
    steps:
      - name: Checkout Klio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: klio
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout CloudNativePG
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: cloudnative-pg/cloudnative-pg
          path: cloudnativepg
          fetch-depth: 0

      - name: Cleanup disk
        uses: ./klio/.github/actions/cleanup-disk

      - name: Setup dagger
        uses: ./klio/.github/actions/setup-dagger

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: 'cloudnativepg/go.mod'

      - name: Start Kind cluster
        id: kind-cluster
        working-directory: cloudnativepg
        run: |
          hack/setup-cluster.sh create load deploy
          CLUSTERS=$(kind get clusters)
          echo "clusters=$CLUSTERS" >> $GITHUB_OUTPUT

      - name: Run integration tests
        working-directory: klio
        env:
          KIND_CLUSTER_NAME: ${{ steps.kind-cluster.outputs.clusters }}
        run: |
          task integration:e2e

  renovate:
    name: Renovate Linter
    needs:
      - change-triage
    if: needs.change-triage.outputs.renovate-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate Renovate JSON
        env:
          # renovate: datasource=npm depName=renovate versioning=semver
          RENOVATE_VERSION: 41.53.1
        run: npx --yes --package renovate@${RENOVATE_VERSION} -- renovate-config-validator

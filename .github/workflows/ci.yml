name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  change-triage:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      docs-changed: ${{ steps.event-filter.outputs.docs-changed || steps.paths-filter.outputs.docs-changed }}
      core-changed: ${{ steps.event-filter.outputs.core-changed || steps.paths-filter.outputs.core-changed }}
      operator-changed: ${{ steps.event-filter.outputs.operator-changed || steps.paths-filter.outputs.operator-changed }}
      renovate-changed: ${{ steps.event-filter.outputs.renovate-changed || steps.paths-filter.outputs.renovate-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check for changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: paths-filter
        with:
          filters: |
            docs-changed:
              - 'documentation/**'
              - 'core/proto/**/*.proto'
              - 'operator/api/**/*.go'
              - 'operator/dist/chart/values.yaml'
              - 'Taskfile.yml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            core-changed:
              - 'core/!(licenses)**'
              - 'Taskfile.yml'
              - '.github/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            operator-changed:
              - 'operator/!(licenses)**'
              - 'Taskfile.yml'
              - '.github/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            renovate-changed:
              - 'renovate.json'

      - name: Evaluate branches
        id: event-filter
        if: github.event_name == 'push' || github.head_ref == 'release-please--branches--main'
        # Forcing all change flags to true for pushes to main (let's make sure we build all dev artifacts)
        # and release-please branch events (let's make sure our releases pass the tests)
        run: |
          echo "docs-changed=true" >> $GITHUB_OUTPUT
          echo "core-changed=true" >> $GITHUB_OUTPUT
          echo "operator-changed=true" >> $GITHUB_OUTPUT
          echo "renovate-changed=true" >> $GITHUB_OUTPUT


  commitlint:
    name: Commit Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Run commitlint
        run: |
          task all:commitlint

  documentation:
    name: Documentation CI
    needs:
      - change-triage
    if: needs.change-triage.outputs.docs-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Run CI task
        run: |
          task documentation:ci

  core:
    name: Core CI
    needs:
      - change-triage
    if: needs.change-triage.outputs.core-changed == 'true'
    runs-on: ["edb", "2xlarge"]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cleanup disk
        uses: ./.github/actions/cleanup-disk

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI task
        run: |
          task core:ci

      - name: Upload assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: klio
          path: |
            core/dist/*.deb
            core/dist/*.rpm
            core/dist/*.tar.gz

  operator:
    name: Operator CI
    needs:
      - change-triage
    if: needs.change-triage.outputs.operator-changed == 'true'
    runs-on: ["edb", "2xlarge"]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cleanup disk
        uses: ./.github/actions/cleanup-disk

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI task
        run: |
          task operator:ci

      - name: Operator preflight check
        uses: ./.github/actions/preflight

  integration-tests:
    name: Integration Tests
    needs:
      - change-triage
    if: needs.change-triage.outputs.core-changed == 'true' || needs.change-triage.outputs.operator-changed == 'true'
    runs-on: ["edb", "2xlarge"]
    steps:
      - name: Checkout Klio
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          path: klio
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout CloudNativePG
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          repository: cloudnative-pg/cloudnative-pg
          path: cloudnativepg
          fetch-depth: 0

      - name: Cleanup disk
        uses: ./klio/.github/actions/cleanup-disk

      - name: Setup dagger
        uses: ./klio/.github/actions/setup-dagger

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        with:
          go-version-file: 'cloudnativepg/go.mod'

      - name: Start Kind cluster
        id: kind-cluster
        working-directory: cloudnativepg
        run: |
          hack/setup-cluster.sh create load deploy
          CLUSTERS=$(kind get clusters)
          echo "clusters=$CLUSTERS" >> $GITHUB_OUTPUT

      - name: Run integration tests
        working-directory: klio
        env:
          KIND_CLUSTER_NAME: ${{ steps.kind-cluster.outputs.clusters }}
        run: |
          task integration:e2e

  olm:
    name: OLM Bundle & Catalog
    env:
      # The OpenShift Catalog is just for internal testing purpose until it won't.
      ENVIRONMENT: "testing"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cleanup disk
        uses: ./.github/actions/cleanup-disk

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io using Podman
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OLM task
        run: |
          task olm:catalog

      - name: Upload OLM catalog
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: klio-olm
          path: |
            operator/klio-operator-template.yaml
            operator/bundle

  renovate:
    name: Renovate Linter
    needs:
      - change-triage
    if: needs.change-triage.outputs.renovate-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate Renovate JSON
        env:
          # renovate: datasource=npm depName=renovate versioning=semver
          RENOVATE_VERSION: 42.92.10
        run: npx --yes --package renovate@${RENOVATE_VERSION} -- renovate-config-validator

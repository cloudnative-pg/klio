name: Renovate Autoapprove
on:
  pull_request:
permissions:
  pull-requests: write
jobs:
  autoapprove:
    runs-on: ubuntu-latest
    if: github.actor == 'cnp-autobot' && startsWith(github.head_ref, 'renovate/')
    steps:
      - name: Auto approve Renovate PRs
        uses: hmarr/auto-approve-action@v4.0.0
        with:
          review-message: "Auto approved automated PR"

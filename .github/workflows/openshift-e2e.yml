name: OpenShift E2E

on:
  workflow_call:
    inputs:
      catalog-artifact-name:
        description: "Artifact name holding the pre-built Klio OLM catalog."
        type: string
        required: true
    secrets:
      REDHAT_REGISTRY_DOCKERCONFIG:
        description: "Red Hat pull secret used to start the CRC cluster."
        required: true

permissions:
  contents: read
  packages: read

jobs:
  openshift-e2e:
    name: OpenShift E2E
    runs-on: ${{ github.repository_owner == 'cloudnative-pg' && 'ubuntu-latest-16-cores' || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      ENVIRONMENT: "testing"
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Cleanup disk
        uses: ./.github/actions/cleanup-disk

      - name: Install Task
        shell: bash
        env:
          # renovate: datasource=github-tags depName=go-task/task versioning=semver
          TASK_VERSION: 3.52.0
        run: |
          curl -sSfL "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin task

      - name: Download pre-built Klio OLM catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.catalog-artifact-name }}
          path: operator

      - name: Start OpenShift cluster (CRC)
        uses: crc-org/crc-github-action@c32030519c129bdaeedf2f313670831c2195526e # v1
        with:
          pull-secret: ${{ secrets.REDHAT_REGISTRY_DOCKERCONFIG }}
          preset: openshift
          cpus: 8
          memory: 20480
          disk: 80

      - name: Export kubeconfig path
        # EXTERNAL_KUBECONFIG points the olm/integration tasks below at the CRC
        # cluster started above.
        run: echo "EXTERNAL_KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Run Red Hat preflight (check operator)
        # Certify the OLM bundle on the freshly started cluster, before the e2e
        # suite installs the operator. preflight installs into its own namespace,
        # so it stays isolated from the e2e install in openshift-operators.
        continue-on-error: true
        run: task olm:preflight-operator ENVIRONMENT=testing

      - name: Run e2e tests on OpenShift
        run: task integration:e2e-openshift

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openshift_e2e_logs
          path: |
            operator/test/e2e/e2e_cluster_logs/
          if-no-files-found: ignore

      - name: Delete CRC cluster
        if: always()
        run: crc delete -f || true

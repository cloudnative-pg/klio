name: Release Publish
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  release-publish:
    if: github.repository_owner == 'cloudnative-pg'
    runs-on: ${{ vars.CI_RUNNERS || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages, images, helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task all:publish

      - name: Attach the CRDs manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for crd in operator/dist/chart/crds/*.yaml; do
            echo "---"
            cat "${crd}"
          done > klio-crds.yaml
          gh release upload "${TAG}" klio-crds.yaml \
            --repo "${GITHUB_REPOSITORY}" --clobber

  check-release:
    name: Evaluate the release tag
    needs:
      - release-publish
    if: github.repository_owner == 'cloudnative-pg'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      is-latest: ${{ steps.check.outputs.is-latest }}
    steps:
      - name: Check whether this is the newest release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '.tag_name' 2>/dev/null || true)
          is_latest="false"
          if [ "${latest}" = "${TAG}" ]; then
            is_latest="true"
          fi
          echo "is-latest=${is_latest}" >> "${GITHUB_OUTPUT}"
          echo "Release ${TAG} is-latest=${is_latest} (latest is ${latest})"

  olm-bundle:
    name: Build and push the OLM bundle and catalog images
    needs:
      - release-publish
      - check-release
    if: needs.check-release.outputs.is-latest == 'true' &&
        github.repository_owner == 'cloudnative-pg'
    env:
      ENVIRONMENT: "production"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io using Podman
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the bundle and catalog
        run: |
          task olm:publish

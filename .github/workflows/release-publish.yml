name: Release Publish
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  release-publish:
    if: github.repository_owner == 'cloudnative-pg'
    runs-on: ${{ vars.CI_RUNNERS || 'ubuntu-latest' }}
    outputs:
      operator-image: ${{ steps.images.outputs.operator-image }}
      sidecar-image: ${{ steps.images.outputs.sidecar-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages, images, helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task all:publish

      # Read the images just published from the bake metadata, picking the
      # release tag rather than the moving "latest" one. The OLM bundle ships
      # the UBI variant of the operator, the one submitted to Red Hat
      # certification.
      - name: Read the published images
        id: images
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          operator=$(jq -r --arg tag "${TAG}-ubi9" \
            '.ubi."image.name" | split(",") | map(select(endswith(":" + $tag))) | .[0] // empty' \
            operator/metadata.json)
          sidecar=$(jq -r --arg tag "${TAG}" \
            '.default."image.name" | split(",") | map(select(endswith(":" + $tag))) | .[0] // empty' \
            core/metadata.json)
          if [ -z "${operator}" ] || [ -z "${sidecar}" ]; then
            echo "::error::release images for ${TAG} not found in the bake metadata"
            exit 1
          fi
          echo "operator-image=${operator}" >> "${GITHUB_OUTPUT}"
          echo "sidecar-image=${sidecar}" >> "${GITHUB_OUTPUT}"

      - name: Attach the CRDs manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for crd in operator/dist/chart/crds/*.yaml; do
            echo "---"
            cat "${crd}"
          done > klio-crds.yaml
          gh release upload "${TAG}" klio-crds.yaml \
            --repo "${GITHUB_REPOSITORY}" --clobber

  check-release:
    name: Evaluate the release tag
    needs:
      - release-publish
    if: github.repository_owner == 'cloudnative-pg'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      is-latest: ${{ steps.check.outputs.is-latest }}
    steps:
      - name: Check whether this is the newest release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '.tag_name' 2>/dev/null || true)
          is_latest="false"
          if [ "${latest}" = "${TAG}" ]; then
            is_latest="true"
          fi
          echo "is-latest=${is_latest}" >> "${GITHUB_OUTPUT}"
          echo "Release ${TAG} is-latest=${is_latest} (latest is ${latest})"

  olm-bundle:
    name: Build and push the OLM bundle and catalog images
    needs:
      - release-publish
      - check-release
    if: needs.check-release.outputs.is-latest == 'true' &&
        github.repository_owner == 'cloudnative-pg'
    env:
      ENVIRONMENT: "production"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup dagger
        uses: ./.github/actions/setup-dagger

      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the bundle and catalog
        env:
          OPERATOR_IMAGE: ${{ needs.release-publish.outputs.operator-image }}
          SIDECAR_IMAGE: ${{ needs.release-publish.outputs.sidecar-image }}
        run: |
          task olm:publish \
            OPERATOR_IMAGE="${OPERATOR_IMAGE}" \
            SIDECAR_IMAGE="${SIDECAR_IMAGE}"

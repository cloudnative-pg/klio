# renovate: datasource=github-tags depName=go-task/task versioning=semver
version: 3.50.0

# We have multiple parallel tasks that run for a long time. Prefix their output with the task name so we can understand
# what task is writing.
output: prefixed

vars:
  BUILDER_NAME: klio-builder
  REGISTRY_CERT_VOLUME: certs-klio
  REGISTRY_NETWORK: klio
  REGISTRY_NAME: '{{ .REGISTRY_NAME | default "registry.dev" }}'
  REGISTRY_PORT: '{{ .REGISTRY_PORT | default 5000 }}'
  GIT_TAG_VERSION:
    sh: git describe --tags --match 'v*' | sed -e 's/^v//; s/-g[0-9a-f]\+$$//; s/-\([0-9]\+\)$$/-dev\1/'
  GITHUB_REF_NAME: '{{ .GITHUB_REF_NAME | default "dev" }}'
  CLEANED_REF_NAME: '{{ regexReplaceAll "[/_]" .GITHUB_REF_NAME "-" }}'
  IMAGE_TAG: '{{ .IMAGE_TAG | default (regexReplaceAll "(\\d+)-merge" .CLEANED_REF_NAME "pr-${1}") }}'
  KUBECONFIG_PATH: ./kubeconfig-integration

tasks:

  ####################################
  ## ALL
  ####################################

  all:ci:
    desc: Run the CI pipeline
    deps:
      - all:commitlint
      - core:ci
      - documentation:ci
      - operator:ci

  all:commitlint:
    desc: Check for conventional commits
    env:
      # renovate: datasource=git-refs depName=commitlint lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_COMMITLINT_SHA: f84ac0c681fcfff4d6f138bf53d44d023f615b48
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/commitlint@${DAGGER_COMMITLINT_SHA}
        lint --source . --args "--from=origin/main" stdout

  all:publish:
    desc: Publish the release artifacts
    deps:
      - core:goreleaser-publish
      - core:containerize-publish
      - operator:containerize-publish
      - operator:helm-publish

  ####################################
  ## CORE
  ####################################

  core:ci:
    desc: Run the core CI pipeline
    deps:
      - core:lint
      - core:protolint
      - core:protoc-gen-go-grpc
      - core:go-test
      - core:containerize-snapshot
      - core:uncommitted

  core:lint:
    desc: Run golangci-lint on core
    deps:
      - core:protoc-gen-go-grpc
    cmds:
      - task: internal:lint
        vars:
          WORKDIR: "core"
    sources:
      - core/**/*.go

  core:protolint:
    desc: Run protolint
    dir: core
    run: once
    env:
      # renovate: datasource=git-refs depName=protolint lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_PROTOLINT_SHA: f84ac0c681fcfff4d6f138bf53d44d023f615b48
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/protolint@${DAGGER_PROTOLINT_SHA}
        lint --source . --args "--config_path=.protolint.yaml" --args proto/ stdout
    sources:
      - proto/**/*.proto

  core:protoc-gen-go-grpc:
    desc: Compile proto files
    deps:
      - core:protolint
    dir: core
    run: once
    env:
      # renovate: datasource=git-refs depName=protoc-gen-go-grpc lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_PROTOC_GEN_GO_GRPC_SHA: f84ac0c681fcfff4d6f138bf53d44d023f615b48
    cmds:
      - >
        GITHUB_REF= dagger -s call
        -m github.com/cloudnative-pg/daggerverse/protoc-gen-go-grpc@${DAGGER_PROTOC_GEN_GO_GRPC_SHA}
        run --source . --go-opt module=github.com/cloudnative-pg/klio/core/internal/grpc
        --go-grpcopt module=github.com/cloudnative-pg/klio/core/internal/grpc --proto-path proto -o internal/grpc/
    sources:
      - proto/**/*.proto

  core:clean:
    desc: Cleanup of the core build artifacts
    dir: core
    cmds:
      - rm -rf internal/grpc/*.pb.go

  core:go-test:
    desc: Run go test
    deps:
      - core:protoc-gen-go-grpc
    cmds:
      - task: internal:go-test
        vars:
          WORKDIR: "core"
    sources:
      - core/**/*.go

  core:goreleaser-snapshot:
    desc: Build snapshot packages
    deps:
      - core:protoc-gen-go-grpc
    vars:
      # renovate: datasource=github-tags depName=goreleaser/goreleaser versioning=semver
      GORELEASER_VERSION: v2.15.4
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.26.2@sha256:b54cbf583d390341599d7bcbc062425c081105cc5ef6d170ced98ef9d047c716
    run: once
    cmds:
      # Goreleaser needs the .git directory to figure out the version from the tags.
      # Given that it is easier to have .goreleaser.yaml in the core directory, we
      # run goreleaser from there, mounting the whole repository as /src and
      # setting the workdir to /src/core.
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-mounted-cache --cache go-mod --path "/go/pkg/mod"
        with-env-variable --name GOMODCACHE --value /go/pkg/mod
        with-mounted-cache --cache go-build --path "/root/.cache/go-build"
        with-env-variable --name GOCACHE --value /root/.cache/go-build
        with-exec --args sh --args '-c' --args 'curl -sfL -o /tmp/goreleaser.tar.gz https://github.com/goreleaser/goreleaser/releases/download/{{ .GORELEASER_VERSION }}/goreleaser_Linux_$(uname -m | sed s/aarch64/arm64/).tar.gz'
        with-exec --args sh --args '-c' --args 'tar -xzf /tmp/goreleaser.tar.gz -C /usr/local/bin goreleaser'
        with-mounted-directory --path /src --source .
        with-workdir --path /src/core
        with-exec --args sh --args '-c' --args 'goreleaser release --clean --snapshot --config .goreleaser.yaml --skip=publish'
        directory --path .
        filter --include dist
        export --path core

      # TODO: revert this workaround when https://github.com/dagger/dagger/issues/6387 is fixed.
      # "directory --path dist export --path dist" should work properly but it creates the dist/
      # directory with wrong permissions (0700).
    sources:
      - ./**/*
      - exclude: dist/**/*

  core:goreleaser-publish:
    desc: Upload the release artifacts
    deps:
      - core:protoc-gen-go-grpc
      - core:uncommitted
    run: once
    requires:
      # We expect this to run in a GitHub workflow, so we put a few GitHub-specific vars here
      # to prevent running this task locally by accident.
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
        - GITHUB_TOKEN
    preconditions:
      - sh: "[[ {{.GITHUB_REF}} =~ 'refs/tags/v.*' ]]"
        msg: not a tag, failing
    vars:
      # renovate: datasource=github-tags depName=goreleaser/goreleaser versioning=semver
      GORELEASER_VERSION: v2.15.4
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.26.2@sha256:b54cbf583d390341599d7bcbc062425c081105cc5ef6d170ced98ef9d047c716
    cmds:
      # Goreleaser needs the .git directory to figure out the version from the tags.
      # Given that it is easier to have .goreleaser.yaml in the core directory, we
      # run goreleaser from there, mounting the whole repository as /src and
      # setting the workdir to /src/core.
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-mounted-cache --cache go-mod --path "/go/pkg/mod"
        with-env-variable --name GOMODCACHE --value /go/pkg/mod
        with-mounted-cache --cache go-build --path "/root/.cache/go-build"
        with-env-variable --name GOCACHE --value /root/.cache/go-build
        with-exec --args sh --args '-c' --args 'curl -sfL -o /tmp/goreleaser.tar.gz https://github.com/goreleaser/goreleaser/releases/download/{{ .GORELEASER_VERSION }}/goreleaser_Linux_$(uname -m | sed s/aarch64/arm64/).tar.gz'
        with-exec --args sh --args '-c' --args 'tar -xzf /tmp/goreleaser.tar.gz -C /usr/local/bin goreleaser'
        with-mounted-directory --path /src --source .
        with-workdir --path /src/core
        with-env-variable --name GITHUB_TOKEN --value {{.GITHUB_TOKEN }}
        with-exec --args sh --args '-c' --args 'goreleaser release --clean --config .goreleaser.yaml'
        directory --path .
        filter --include dist
        export --path core

  core:containerize-snapshot:
    desc: Snapshot container images
    dir: core
    deps:
      - core:goreleaser-snapshot
      - internal:start-registry
    vars:
      TAG: '{{ .TAG | default .IMAGE_TAG }}'
      GITHUB_ACTIONS: '{{ .GITHUB_ACTIONS }}'
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "testing"
          INSECURE: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
          REGISTRY: '{{ if .GITHUB_ACTIONS }}ghcr.io/enterprisedb{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
          VERSION: "{{ .TAG }}"
          LATEST: "false"
          WORKDIR: "core"

  core:containerize-publish:
    desc: Publish container images
    deps:
      - core:goreleaser-publish
    requires:
      # We expect this to run in a GitHub workflow, so we put a few GitHub-specific vars here
      # to prevent running this task locally by accident.
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
    preconditions:
      - sh: "[[ {{.GITHUB_REF}} =~ 'refs/tags/v.*' ]]"
        msg: not a tag, failing
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "production"
          REGISTRY: "ghcr.io/enterprisedb"
          INSECURE: "false"
          VERSION: "{{ .GITHUB_REF_NAME }}"
          LATEST: "true"
          WORKDIR: "core"

  core:licenses:
    desc: Generate core licenses
    cmds:
      - task: internal:licenses
        vars:
          WORKDIR: "core"
    sources:
      - ./**/*

  core:uncommitted:
    desc: Check for uncommitted changes
    deps:
        - core:protoc-gen-go-grpc
    cmds:
      - task: internal:uncommitted
    sources:
      - ./**/*

  ####################################
  ## INTERNAL
  ####################################

  internal:generate-certs:
    desc: Generate certificates for the local registry
    run: once
    internal: true
    cmds:
      - >
        mkdir -p certs &&
        docker volume create {{ .REGISTRY_CERT_VOLUME }} &&
        docker run -v {{ .REGISTRY_CERT_VOLUME }}:/certs -w /certs --name certs-klio --entrypoint=/bin/sh alpine/openssl -c '
        openssl genrsa -out ca-key.pem 4096 &&
        openssl req -new -x509 -days 365 -key ca-key.pem -sha256 -out ca.pem \
            -subj "/O=CloudNativePG/OU=Barman Cloud Plugin Testing" &&
        openssl genrsa -out server-key.pem 4096 &&
        openssl req -subj "/CN={{ .REGISTRY_NAME }}" -sha256 -new -key server-key.pem -out server.csr &&
        echo subjectAltName = DNS:{{ .REGISTRY_NAME }},IP:127.0.0.1 >> extfile.cnf &&
        echo extendedKeyUsage = serverAuth >> extfile.cnf &&
        openssl x509 -req -days 365 -sha256 -in server.csr -CA ca.pem -CAkey ca-key.pem \
            -CAcreateserial -out server-cert.pem -extfile extfile.cnf'
        docker cp certs-klio:/certs/ca.pem certs/ca.pem &&
        docker rm certs-klio
    status:
      - docker volume inspect {{ .REGISTRY_CERT_VOLUME }}
      - test -f certs/ca.pem

  internal:start-build-network:
    desc: Create a docker network for image building used by the dagger engine and the registry
    internal: true
    run: once
    cmds:
      - docker network create {{ .REGISTRY_NETWORK}}
    status:
      - docker network inspect {{ .REGISTRY_NETWORK }}

  internal:start-registry:
    desc: Start a container registry
    internal: true
    run: once
    deps:
      - internal:generate-certs
      - internal:start-build-network
    env:
      # renovate: datasource=docker depName=registry versioning=docker
      REGISTRY_VERSION: 3.1.0@sha256:8a7c1aae9db5028cbc1cfe83e5969d270a50e8bc0b72eef3cc5657542ec383c9
    cmds:
      - >
        docker run -d --name {{ .REGISTRY_NAME }}
        --network {{ .REGISTRY_NETWORK }}
        -v {{ .REGISTRY_CERT_VOLUME }}:/certs
        -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server-cert.pem -e REGISTRY_HTTP_TLS_KEY=/certs/server-key.pem
        registry:${REGISTRY_VERSION}
    status:
      - \[ "$(docker inspect -f {{`'{{.State.Running}}'`}} "{{ .REGISTRY_NAME }}" 2> /dev/null)" == 'true' \]

  internal:registry-network-connect:
    desc: Make sure the registry is connected to the registry network
    summary: If we started the registry on our own, it should already be connected. However, if the registry was started
      somewhere else, it may not be on the expected network.
    internal: true
    deps:
      - internal:start-registry
    run: once
    cmds:
      - docker network connect {{ .REGISTRY_NETWORK }} {{ .REGISTRY_NAME }} || true
    status:
      - docker network inspect {{ .REGISTRY_NETWORK }} -f '{{ range .Containers }}{{ .Name }} {{ end }}' | grep "{{ .REGISTRY_NAME }}"

  internal:create-builder:
    desc: Create a buildx builder
    internal: true
    run: once
    deps:
      - internal:start-build-network
    cmds:
      - dagger run docker buildx create --name {{ .BUILDER_NAME }} --driver-opt "network={{ .REGISTRY_NETWORK }}"
    status:
      - docker buildx inspect {{ .BUILDER_NAME }}

  internal:containerize:
    desc: Build container images
    dir: '{{ .WORKDIR }}'
    deps:
      - internal:create-builder
      - internal:registry-network-connect
    internal: true
    requires:
      vars:
        - ENVIRONMENT
        - REGISTRY
        - INSECURE
        - VERSION
        - LATEST
        - WORKDIR
    env:
      environment: "{{ .ENVIRONMENT }}"
      registry: "{{ .REGISTRY }}"
      insecure: "{{ .INSECURE }}"
      version: "{{ .VERSION }}"
      latest: "{{ .LATEST }}"
    cmds:
      - dagger run docker buildx bake --builder {{ .BUILDER_NAME }} --push --metadata-file metadata.json

  internal:lint:
    desc: Run golangci-lint
    env:
      # renovate: datasource=git-refs depName=golangci-lint lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_GOLANGCI_LINT_SHA: 5dcc7e4c4cd5ed230046955f42e27f2166545155
      # renovate: datasource=docker depName=golangci/golangci-lint versioning=docker
      GOLANGCI_LINT_VERSION: v2.11.4@sha256:67dfc9eeeb0eb13fc1a36329c2c378197dc561f1edf1a7792e3f771606bb0e15
    internal: true
    dir: '{{ .WORKDIR }}'
    cmds:
      - >
        echo $(pwd);
        GITHUB_REF= dagger -c
        "github.com/sagikazarmark/daggerverse/golangci-lint@${DAGGER_GOLANGCI_LINT_SHA}
        --version ${GOLANGCI_LINT_VERSION} | run . --config .golangci.yml | stdout"

  internal:go-test:
    desc: Run go test
    internal: true
    dir: '{{ .WORKDIR }}'
    env:
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.26.2@sha256:b54cbf583d390341599d7bcbc062425c081105cc5ef6d170ced98ef9d047c716
      # renovate: datasource=custom.envtest depName=kubernetes packageName=https://github.com/kubernetes/kubernetes versioning=semver
      K8S_VERSION: 1.36.0
      # renovate: datasource=git-refs depName=controller-runtime packageName=https://github.com/kubernetes-sigs/controller-runtime versioning=semver
      SETUP_ENVTEST_VERSION: 0.24.0
    cmds:
      # TODO: move this out of the plugin repo and into the daggerverse
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/plugin-barman-cloud/dagger/gotest
        --go-version ${GOLANG_IMAGE_VERSION}
        --kube-version ${K8S_VERSION}
        --setup-envtest-version ${SETUP_ENVTEST_VERSION}
        unit-test --src .

  internal:uncommitted:
    desc: Check for uncommitted changes
    internal: true
    env:
      # renovate: datasource=git-refs depName=uncommitted lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_UNCOMMITTED_SHA: f84ac0c681fcfff4d6f138bf53d44d023f615b48
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/uncommitted@${DAGGER_UNCOMMITTED_SHA}
        check-uncommitted --source . stdout

  internal:licenses:
    desc: Generate licenses
    internal: true
    dir: '{{ .WORKDIR }}'
    env:
      # renovate: datasource=git-refs depName=go-licenses lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_GO_LICENSES: 838ccbbd35b0e5e9a7d4af600fa8fa1a4259b1d0
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/go-licenses@${DAGGER_GO_LICENSES}
        go-licenses --source . --args "save" --args "./..." --args "--force"
        --args "--save_path=licenses/go-licenses" --args "--ignore=github.com/cloudnative-pg/klio"
        directory --path licenses/ export --path licenses/

  ####################################
  ## OPERATOR
  ####################################

  operator:ci:
    desc: Run the operator CI pipeline
    deps:
      - operator:lint
      - operator:go-test
      - operator:controller-gen
      - operator:containerize-snapshot
      - operator:helm-chart
      - operator:helm-lint
      - operator:uncommitted

  operator:lint:
    desc: Run golangci-lint on operator
    cmds:
      - task: internal:lint
        vars:
          WORKDIR: "operator"
    sources:
      - ./**/*.go

  operator:go-test:
    desc: Run go test
    deps:
      - operator:controller-gen
    cmds:
      - task: internal:go-test
        vars:
          WORKDIR: "operator"
    sources:
      - operator/**/*.go

  operator:containerize-snapshot:
    desc: Snapshot container images
    dir: operator
    deps:
      - internal:start-registry
      - operator:controller-gen
    vars:
      TAG: '{{ .TAG | default .IMAGE_TAG }}'
      GITHUB_ACTIONS: '{{ .GITHUB_ACTIONS }}'
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "testing"
          INSECURE: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
          REGISTRY: '{{ if .GITHUB_ACTIONS }}ghcr.io/enterprisedb{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
          VERSION: "{{ .TAG }}"
          LATEST: "false"
          WORKDIR: "operator"

  operator:containerize-publish:
    desc: Publish operator images
    requires:
      # We expect this to run in a GitHub workflow, so we put a few GitHub-specific vars here
      # to prevent running this task locally by accident.
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
    preconditions:
      - sh: "[[ {{.GITHUB_REF}} =~ 'refs/tags/v.*' ]]"
        msg: not a tag, failing
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "production"
          REGISTRY: "ghcr.io/enterprisedb"
          INSECURE: "false"
          VERSION: "{{ .GITHUB_REF_NAME }}"
          LATEST: "true"
          WORKDIR: "operator"

  operator:controller-gen:
    desc: Run controller-gen
    dir: operator
    run: once
    env:
      # renovate: datasource=git-refs depName=controller-gen lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_CONTROLLER_GEN_SHA: f84ac0c681fcfff4d6f138bf53d44d023f615b48
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/controller-gen@${DAGGER_CONTROLLER_GEN_SHA}
        controller-gen --source . --args object:headerFile=hack/boilerplate.go.txt --args paths=./api/...
        file --path api/v1alpha1/zz_generated.deepcopy.go export --path api/v1alpha1/zz_generated.deepcopy.go
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/controller-gen@${DAGGER_CONTROLLER_GEN_SHA}
        controller-gen --source . --args rbac:roleName=manager-role --args crd --args webhook
        --args paths=./api/... --args paths=./internal/... --args output:crd:artifacts:config=config/crd/bases
        directory --path config/
        filter --include crd/bases/,rbac/
        export --path config/
    sources:
      - ./api/**/*.go
      - ./internal/**/*.go
    generates:
      - ./api/v1alpha1/zz_generated.deepcopy.go
      - ./config/rbac/role.yaml
      - ./config/crd/bases/*.yaml

  operator:helm-chart:
    desc: Generate the Helm chart for the operator
    deps:
      - operator:controller-gen
    dir: operator
    run: once
    env:
      # renovate: datasource=git-refs depName=kustomize lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_KUSTOMIZE_SHA: 5dcc7e4c4cd5ed230046955f42e27f2166545155
      # renovate: datasource=docker depName=registry.k8s.io/kustomize/kustomize versioning=docker
      KUSTOMIZE_IMAGE_VERSION: v5.8.1@sha256:899fcd3bc898160e62bcaf82932b0cb29ba38d16272353db2e7acbba82129429
    cmds:
      # Generate the Helm chart for the operator.
      # Kubebuilder wants to generate the CRDs in the chart/templates/crd directory, but we want to
      # generate them in the chart/crds directory, as the Helm convention is that CRDs should not be templates.
      # We build the CRDs in a second step with kustomize.
      # We filter out the templates that are managed manually, so we don't override them.
      - >
        GITHUB_REF= dagger -s call -m dagger/helmify
        run --source ./config
        filter
        --exclude templates/certmanager
        --exclude templates/deployment.yaml
        --exclude templates/service.yaml
        --exclude templates/metrics-service.yaml
        --exclude templates/prometheus.yaml
        --exclude .helmignore
        --exclude Chart.yaml
        --exclude values.yaml
        export --path dist/chart
    sources:
      - config/**/*
    generates:
      - dist/**

  operator:helm-lint:
    desc: Lint the Helm chart for the operator
    dir: operator
    run: once
    deps:
      - operator:helm-chart
    env:
      # renovate: datasource=git-refs depName=helm lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_HELM_SHA: 5dcc7e4c4cd5ed230046955f42e27f2166545155
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/helm@${DAGGER_HELM_SHA}
        lint --chart dist/chart/ stdout
    sources:
      - dist/chart/**/*

  operator:helm-publish:
    desc: Publish the Helm chart for the operator as an OCI artifact
    dir: operator
    run: once
    deps:
      - operator:helm-chart
    requires:
      # We expect this to run in a GitHub workflow, so we put a few GitHub-specific vars here
      # to prevent running this task locally by accident.
      vars:
        - CI
        - GITHUB_ACTOR
        - GITHUB_TOKEN
    env:
      # renovate: datasource=git-refs depName=helm lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_HELM_SHA: 5dcc7e4c4cd5ed230046955f42e27f2166545155
      GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
    cmds:
      # Nothing should have changed in the chart, so we can use the uncommitted task to check for changes.
      - task: internal:uncommitted
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/helm@${DAGGER_HELM_SHA}
        package --chart dist/chart/
        with-name --name klio_chart.tgz
        export --path dist/chart/ --allow-parent-dir-path
      # TODO: sign the chart
      # Pushing the chart to the registry. It automatically gets the name and the
      # version from the Chart.yaml file.
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/helm@${DAGGER_HELM_SHA}
        with-registry-auth --address "ghcr.io/enterprisedb" --username "{{ .GITHUB_ACTOR }}" --secret env://GITHUB_TOKEN
        push --pkg dist/chart/klio_chart.tgz
        --registry "oci://ghcr.io/enterprisedb/"
    sources:
      - dist/chart/**/*

  operator:uncommitted:
    desc: Check for uncommitted changes after chart generation
    deps:
      - operator:helm-chart
    cmds:
      - task: internal:uncommitted
    sources:
      - ./**/*

  operator:licenses:
    desc: Generate operator licenses
    cmds:
      - task: internal:licenses
        vars:
          WORKDIR: "operator"
    sources:
      - ./**/*

  ####################################
  ## OLM
  ####################################

  olm:all:
    desc: Generate the OLM bundle, catalog image, and CatalogSource YAML
    requires:
      vars:
        - ENVIRONMENT
    deps:
      - olm:catalog
      - olm:catalog-source

  olm:manifest:
    run: once
    internal: true
    requires:
      vars:
        - ENVIRONMENT
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/enterprisedb{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
      # renovate: datasource=git-refs depName=kustomize lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_KUSTOMIZE_SHA: 5dcc7e4c4cd5ed230046955f42e27f2166545155
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/kustomize@${DAGGER_KUSTOMIZE_SHA}
        edit --source .
        --dir operator/config/manifests
        set image --image controller=${registry}/klio-operator${suffix}:${tag}
        directory directory --path operator/config/manifests export --path operator/config/manifest-build
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/kustomize@${DAGGER_KUSTOMIZE_SHA}
        build --source operator/config --dir manifest-build
        export --path operator/olm-manifests/manifest.yaml

    sources:
      - operator/config/**/*
    generates:
      - operator/olm-manifests/manifest.yaml

  olm:bundle:
    desc: Generate the OLM bundle for the operator
    run: once
    deps:
      - olm:manifest
    env:
      # renovate: datasource=docker depName=quay.io/operator-framework/operator-sdk versioning=docker
      OPERATOR_SDK_IMAGE_VERSION: v1.42.2@sha256:1b37b208f424e5abec0dc2045b54d3942e2eb03e085f48baf19aff7e5a333d84
    cmds:
      - >
        docker
        run --rm
        -u $(id -u)
        -v $(pwd)/operator:/operator
        -w /operator/
        quay.io/operator-framework/operator-sdk:${OPERATOR_SDK_IMAGE_VERSION}
        generate bundle
        --input-dir olm-manifests/
        --kustomize-dir config/manifests
        --version {{ .GIT_TAG_VERSION }}
    sources:
      - operator/olm-manifests/**
    generates:
      - bundle/

  olm:build:
    desc: Build the require OLM bundle image after generating the bundle
    requires:
      vars:
        - ENVIRONMENT
    deps:
      - internal:create-builder
      - internal:registry-network-connect
      - olm:bundle
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/enterprisedb{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
    cmds:
      - >
        docker buildx build
        --builder {{ .BUILDER_NAME }}
        --push
        -t ${registry}/klio-operator${suffix}:${tag}-bundle
        -f operator/bundle.Dockerfile
        --output="type=image,registry.insecure=${insecure}"
        operator/

  olm:catalog-file:
    internal: false
    run: once
    deps:
        - olm:build
    requires:
      vars:
        - ENVIRONMENT
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/enterprisedb{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
      # renovate: datasource=docker depName=quay.io/operator-framework/opm versioning=docker
      OPM_IMAGE_VERSION: v1.66.0@sha256:361c7b04206eb6b3b363714ed036825aca15049f54f41b5b5bc791c7cd823bdf
      CONTAINER_AUTH_FILE: '{{ .REGISTRY_AUTH_FILE | default (printf "%s/.docker/config.json" (env "HOME")) }}'
    cmds:
      - >
        mkdir -p operator/catalog/klio-operator
      - >
        echo '{"default":[{"type":"insecureAcceptAnything"}]}' > /tmp/policy.json
      - >
        docker
        run --rm
        -u $(id -u)
        -v $(pwd)/operator/:/operator/
        -w /operator/
        quay.io/operator-framework/opm:${OPM_IMAGE_VERSION}
        generate dockerfile catalog
      - |
        cat << EOF > operator/klio-operator-template.yaml
        Schema: olm.semver
        GenerateMajorChannels: true
        GenerateMinorChannels: false
        Stable:
          Bundles:
          - Image: ${registry}/klio-operator${suffix}:${tag}-bundle
        EOF
      - >
        docker
        run --rm
        --network {{ .REGISTRY_NETWORK }}
        -v /tmp/policy.json:/etc/containers/policy.json
        -v ${CONTAINER_AUTH_FILE}:/.config/containers/auth.json
        -u $(id -u)
        -v $(pwd)/operator/:/operator/
        -w /operator/
        quay.io/operator-framework/opm:${OPM_IMAGE_VERSION}
        alpha render-template semver --skip-tls-verify -o yaml klio-operator-template.yaml > operator/catalog/klio-olm-template.yaml
      - >
        docker
        run --rm
        -u $(id -u)
        -v $(pwd)/operator/:/operator/
        -w /operator/
        quay.io/operator-framework/opm:${OPM_IMAGE_VERSION}
        validate catalog/
    generates:
      - operator/catalog.Dockerfile
      - operator/catalog
      - operator/klio-olm-template.yaml

  olm:catalog:
    desc: Build the OLM catalog image after the bundle image is built
    requires:
      vars:
        - ENVIRONMENT
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/enterprisedb{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
    deps:
      - olm:catalog-file
    cmds:
      - >
        docker buildx build
        --builder {{ .BUILDER_NAME }}
        --push
        -t ${registry}/klio-operator${suffix}:${tag}-catalog
        -f operator/catalog.Dockerfile
        --output="type=image,registry.insecure=${insecure}"
        operator/

  olm:catalog-source:
    desc: Build the OLM CatalogSource YAML file
    requires:
      vars:
        - ENVIRONMENT
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/enterprisedb{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
    cmds:
      - |
        cat << EOF > operator/klio-operator-catalog-source.yaml
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
           name: klio-catalog
           namespace: openshift-marketplace
        spec:
           sourceType: grpc
           image: ${registry}/klio-operator${suffix}:${tag}-catalog
           secrets:
               - klio-pull-secret
        EOF

  olm:clean:
    desc: Cleanup of the OLM build artifacts
    cmds:
      - rm -fr operator/olm-manifests
      - rm -fr operator/bundle*
      - rm -fr operator/config/manifest-build/
      - rm -fr operator/catalog*

  ####################################
  ## DOCUMENTATION
  ####################################

  documentation:ci:
    desc: Run the documentation CI pipeline
    deps:
      - documentation:cli
      - documentation:spellcheck
      - documentation:protoc-gen-doc
      - documentation:apidoc
      - documentation:helm-chart
      - documentation:docusaurus-build-test
      - documentation:docusaurus-version-is-aligned
      - documentation:uncommitted

  documentation:cli:
    desc: Generate CLI command documentation
    run: once
    vars:
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.26.2-alpine@sha256:f85330846cde1e57ca9ec309382da3b8e6ae3ab943d2739500e08c86393a21b1
    cmds:
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-mounted-cache --cache go-mod --path "/go/pkg/mod"
        with-env-variable --name GOMODCACHE --value /go/pkg/mod
        with-mounted-cache --cache go-build --path "/go/build-cache"
        with-env-variable --name GOCACHE --value /go/build-cache
        with-directory --path /src --source core/ --exclude 'dist/**' --exclude 'licenses/**'
        with-workdir --path /src
        with-env-variable --name CACHEBUST --value "$(date)"
        with-exec --args sh --args '-c' --args "go run main.go gen-doc --output clidoc"
        directory --path clidoc
        export --path documentation/web/docs/user/cli/ --wipe
    sources:
      - core/cmd/**/*.go
    generates:
      - documentation/web/docs/user/cli/*.md
      - documentation/web/docs/user/cli/_category_.json

  documentation:wordlist-ordered:
    desc: Order the word list file
    dir: documentation
    run: once
    cmds:
      - LANG=C LC_ALL=C sort .wordlist.txt > .wordlist.txt.new
      - mv -f .wordlist.txt.new .wordlist.txt
    sources:
      - .wordlist.txt

  documentation:spellcheck:
    desc: Run spellcheck
    dir: documentation
    deps:
      - documentation:wordlist-ordered
      - documentation:protoc-gen-doc
    env:
      # renovate: datasource=git-refs depName=spellcheck lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_SPELLCHECK_SHA: f84ac0c681fcfff4d6f138bf53d44d023f615b48
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/spellcheck@${DAGGER_SPELLCHECK_SHA}
        spellcheck --source . with-exec --use-entrypoint --args="" stdout
    sources:
      - ./**/*.md
      - ./**/*.mdx
      - .spellcheck.yaml
      - .wordlist.txt

  documentation:protoc-gen-doc:
    desc: Generate documentation from proto files
    run: once
    env:
      # renovate: datasource=git-refs depName=protoc-gen-doc lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_PROTOC_GEN_DOC_SHA: f84ac0c681fcfff4d6f138bf53d44d023f615b48
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/protoc-gen-doc@${DAGGER_PROTOC_GEN_DOC_SHA}
        generate --proto-dir core/proto --doc-opt "markdown,_protocol.md" -o documentation/web/docs/developer/
    sources:
      - core/proto/**/*.proto

  documentation:apidoc:
    desc: Generate the server API documentation
    deps:
      - operator:controller-gen
    run: once
    env:
      # renovate: datasource=git-refs depName=crd-gen-refs lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_CRDGENREF_SHA: f84ac0c681fcfff4d6f138bf53d44d023f615b48
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/crd-ref-docs@${DAGGER_CRDGENREF_SHA} generate
        --src .
        --source-path operator/api/v1alpha1
        --config-file documentation/crd-gen-refs/config.yaml
        --renderer markdown
        --templates-dir documentation/crd-gen-refs/markdown
        file --path out.md
        export --path documentation/web/docs/user/api/_klio_api.md
    sources:
      - operator/api/v1alpha1/**/*
      - documentation/crd-gen-refs/**/*

  documentation:helm-chart:
    desc: Generate the the documentation for the Helm chart
    run: once
    deps:
      - operator:helm-chart
    env:
      # renovate: datasource=git-refs depName=helm-docs lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_HELM_DOCS_SHA: 5dcc7e4c4cd5ed230046955f42e27f2166545155
      # renovate: datasource=docker depName=jnorwood/helm-docs versioning=docker
      HELM_DOCS_IMAGE_VERSION: v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/helm-docs@${DAGGER_HELM_DOCS_SHA}
        --version ${HELM_DOCS_IMAGE_VERSION}
        generate --chart operator/dist/chart --templates documentation/helm-docs/helm_chart.md.gotmpl
        export --path documentation/web/docs/user/_helm_chart_values.md
    sources:
      - operator/dist/chart/**/*
      - documentation/helm-docs/helm_chart.md.gotmpl
    generates:
        - documentation/web/docs/user/_helm_chart_values.md

  documentation:docusaurus-build-test:
    desc: Check that the documentation builds
    dir: documentation
    deps:
      - documentation:protoc-gen-doc
      - documentation:apidoc
      - documentation:helm-chart
      - documentation:cli
    env:
      # renovate: datasource=git-refs depName=docusaurus lookupName=https://github.com/levlaz/daggerverse currentValue=main
      DAGGER_DOCUSAURUS_SHA: 93f57fccbd5afd22fa917107ab7697f3e7db0e5a
    cmds:
      - GITHUB_REF= dagger -s call -m github.com/levlaz/daggerverse/docusaurus@${DAGGER_DOCUSAURUS_SHA}
        --src web --yarn build
    sources:
      - ./web/**/*

  documentation:docusaurus-version-is-aligned:
    desc: Verify that a documentation version exists for the current version of the plugin
    # Run a jq query that combines in an array the current release-please version and the
    # documentation versions, and checks that the release-please version is contained in the
    # documentation versions. The command returns exit code 0 if the version is found,
    # and exit code 1 otherwise.
    env:
      # renovate: datasource=docker depName=ghcr.io/jqlang/jq versioning=docker
      JQ_IMAGE_VERSION: 1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
    cmds:
      - >
        dagger core container from --address ghcr.io/jqlang/jq:${JQ_IMAGE_VERSION}
        with-file --source .release-please-manifest.json --path /release-version.json
        with-file --source documentation/web/versions.json --path /documentation-versions.json
        with-exec --args "/jq" --args "-es" --args '.[0][] as $val | .[1] | contains([$val])'
        --args "/release-version.json" --args "/documentation-versions.json"
    sources:
      - .release-please-manifest.json
      - ./web/versions.json

  # FIXME: this times out after a few seconds. It's easier to serve the documentation through a node container.
  documentation:docusaurus-dev-serve:
    desc: Build and serve the dev documentation on http://localhost:3000
    dir: documentation
    deps:
      - documentation:protoc-gen-doc
    env:
      # renovate: datasource=git-refs depName=docusaurus lookupName=https://github.com/levlaz/daggerverse currentValue=main
      DAGGER_DOCUSAURUS_SHA: 93f57fccbd5afd22fa917107ab7697f3e7db0e5a
    cmds:
      # Ctrl-C to terminate the
      - >
        dagger call -m github.com/levlaz/daggerverse/docusaurus@${DAGGER_DOCUSAURUS_SHA}
        --src web --yarn serve-dev up

  documentation:uncommitted:
    desc: Check for uncommitted changes after documentation generation
    deps:
      - documentation:wordlist-ordered
      - documentation:protoc-gen-doc
      - documentation:apidoc
      - documentation:helm-chart
      - documentation:cli
    cmds:
      - task: internal:uncommitted
    sources:
      - ./**/*

  documentation:clean:
    desc: Cleanup of the documentation build artifacts and modules
    dir: documentation
    cmds:
      - rm -rf web/build
      - rm -rf web/docs/developer/protocol.md
      - rm -rf web/node_modules

  ####################################
  ## CLEANUP
  ####################################

  clean:build-env:
    desc: Cleanup of the build environment
    cmds:
      - docker rm -f {{ .REGISTRY_NAME }} 2> /dev/null || true
      - docker buildx rm {{ .BUILDER_NAME }} 2> /dev/null || true
      - docker network rm {{ .REGISTRY_NETWORK }} 2> /dev/null || true
      - docker volume rm {{ .REGISTRY_CERT_VOLUME }} 2> /dev/null || true
      - rm -rf certs/

  clean:all:
    desc: Full cleanup of generated elements
    deps:
      - clean:build-env
      - documentation:clean
      - core:clean
      - olm:clean
    cmds:
      - rm -rf .task/

  ########################################
  ## INTEGRATION
  ########################################

  integration:machinery-lint:
    desc: Run golangci-lint on machinery
    cmds:
      - task: internal:lint
        vars:
          WORKDIR: "integration/tests/machinery"
    sources:
      - integration/tests/machinery/**/*.go

  integration:devenv:
    desc: Create and connect to an ephemeral development environment
    interactive: true
    deps:
      - core:containerize-snapshot
      - operator:containerize-snapshot
      - operator:helm-chart
    cmds:
      - dagger call -m integration/dagger/devenv kubernetes --source .

  integration:deploy-to-kind:
    desc: Deploy the operator on a kind cluster generated by the CNPG hack setup script
    summary: |
      Deploys the Klio operator to a Kind cluster for integration testing. This task assumes a Kind cluster has been
      previously created by the CloudNativePG hack/setup-cluster.sh script. It loads the appropriate kubeconfig,
      applies cert-manager, and installs the operator using Helm.

      The actual command is something like:

      KIND_CLUSTER_NAME=pg-operator-e2e-v1-33-1 task integration:deploy-to-kind
    deps:
      - task: core:containerize-snapshot
        vars:
          GITHUB_ACTIONS: ''
          TAG: 'dev'
      - task: operator:containerize-snapshot
        vars:
          GITHUB_ACTIONS: ''
          TAG: 'dev'
      - operator:helm-chart
    run: once
    requires:
      vars:
        - KIND_CLUSTER_NAME
    vars:
      KIND_HOSTPORT:
        # This command extracts the host port for the control plane of the Kind cluster.
        # Redundant curly braces are used to escape the template syntax in Taskfile.
        sh: docker inspect --format '{{"{{"}} (index (index .HostConfig.PortBindings "6443/tcp") 0).HostPort {{"}}"}}' {{ .KIND_CLUSTER_NAME }}-control-plane
      OPERATOR_IMAGE_REPOSITORY: '{{ .OPERATOR_IMAGE_REPOSITORY | default (printf "%s:%s/klio-operator-testing" .REGISTRY_NAME .REGISTRY_PORT) }}'
      OPERATOR_IMAGE_TAG: '{{ .OPERATOR_IMAGE_TAG | default "dev" }}'
      OPERAND_IMAGE_REPOSITORY: '{{ .OPERAND_IMAGE_REPOSITORY | default (printf "%s:%s/klio-testing" .REGISTRY_NAME .REGISTRY_PORT) }}'
      OPERAND_IMAGE_TAG: '{{ .OPERAND_IMAGE_TAG | default "dev" }}'
      # renovate: datasource=docker depName=alpine/k8s versioning=docker
      ALPINE_K8S_VERSION: 1.35.4@sha256:d9aeef2665287b9918bc57c539ba95382ba4c8d52c8b1310df5666a89d9a3d04
      # renovate: datasource=helm depName=cert-manager versioning=semver registryUrl=https://charts.jetstack.io
      CERT_MANAGER_VERSION: 'v1.20.2'
      # Cache busting timestamp to prevent Dagger from caching helm deployments
      CACHE_BUST:
        sh: date +%s
    cmds:
      - kind get kubeconfig --name {{ .KIND_CLUSTER_NAME }} > {{ .KUBECONFIG_PATH }}
      - |
        dagger << "."
        container | from alpine/k8s:{{ .ALPINE_K8S_VERSION }} | with-mounted-file /kube/.config {{ .KUBECONFIG_PATH }} |
        with-directory /chart operator/dist/chart |
        with-env-variable KUBECONFIG /kube/.config |
        with-service-binding localhost tcp://127.0.0.1:{{ .KIND_HOSTPORT }} |
        with-exec -- sh -c "kubectl config set-cluster kind-{{ .KIND_CLUSTER_NAME }} --server=https://localhost:{{ .KIND_HOSTPORT }}" |
        with-exec -- sh -c "helm repo add jetstack https://charts.jetstack.io --force-update" |
        with-exec -- sh -c "helm upgrade -i --wait --create-namespace --namespace cert-manager --version {{ .CERT_MANAGER_VERSION }} --set crds.enabled=true cert-manager jetstack/cert-manager" |
        with-env-variable CACHE_BUST {{ .CACHE_BUST }} |
        with-exec -- sh -c "helm uninstall --wait --ignore-not-found klio -n cnpg-system || true" |
        with-exec -- sh -c "helm upgrade -i --wait --create-namespace --namespace cnpg-system --set controllerManager.manager.image.repository={{ .OPERATOR_IMAGE_REPOSITORY }} --set controllerManager.manager.image.tag={{ .OPERATOR_IMAGE_TAG }} --set controllerManager.manager.env.SIDECAR_IMAGE={{ .OPERAND_IMAGE_REPOSITORY }}:{{ .OPERAND_IMAGE_TAG }} klio /chart"
        .
      - rm -f {{ .KUBECONFIG_PATH }}

  integration:e2e:
    desc: Run the e2e tests
    deps:
      - integration:deploy-to-kind
    run: once
    requires:
      vars:
        - KIND_CLUSTER_NAME
    vars:
      KIND_HOSTPORT:
        # This command extracts the host port for the control plane of the Kind cluster.
        # Redundant curly braces are used to escape the template syntax in Taskfile.
        sh: docker inspect --format '{{"{{"}} (index (index .HostConfig.PortBindings "6443/tcp") 0).HostPort {{"}}"}}' {{ .KIND_CLUSTER_NAME }}-control-plane
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.26.2-alpine@sha256:f85330846cde1e57ca9ec309382da3b8e6ae3ab943d2739500e08c86393a21b1
    cmds:
      - |
        kind get kubeconfig --name {{ .KIND_CLUSTER_NAME }} > {{ .KUBECONFIG_PATH }}
        dagger << "."
        container | from golang:{{ .GOLANG_IMAGE_VERSION }} | with-mounted-file /kube/.config {{ .KUBECONFIG_PATH }} |
        with-directory /src/operator operator |
        with-workdir /src/operator/test/e2e |
        with-env-variable KUBECONFIG /kube/.config |
        with-service-binding localhost tcp://127.0.0.1:{{ .KIND_HOSTPORT }} |
        with-exec -- sh -c "apk add kubectl" |
        with-exec -- sh -c "kubectl config set-cluster kind-{{ .KIND_CLUSTER_NAME }} --server=https://localhost:{{ .KIND_HOSTPORT }}" |
        with-exec -- sh -c 'go test -timeout 20m -v ./...; echo $? > /src/operator/test/e2e/e2e_cluster_logs/.exitcode; exit 0' |
        directory /src/operator/test/e2e/e2e_cluster_logs | export ./e2e_cluster_logs
        .
        TEST_EXIT=$(cat ./e2e_cluster_logs/.exitcode 2>/dev/null || echo 1)
        rm -f {{ .KUBECONFIG_PATH }}
        exit $TEST_EXIT

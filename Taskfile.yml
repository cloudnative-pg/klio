# renovate: datasource=github-tags depName=go-task/task versioning=semver
version: 3.53.1

# We have multiple parallel tasks that run for a long time. Prefix their output with the task name so we can understand
# what task is writing.
output: prefixed

vars:
  BUILDER_NAME: klio-builder
  REGISTRY_CERT_VOLUME: certs-klio
  REGISTRY_NETWORK: klio
  REGISTRY_NAME: '{{ .REGISTRY_NAME | default "registry.dev" }}'
  REGISTRY_PORT: '{{ .REGISTRY_PORT | default 5000 }}'
  GIT_TAG_VERSION:
    sh: git describe --tags --match 'v*' | sed -e 's/^v//; s/-g[0-9a-f]\+$$//; s/-\([0-9]\+\)$$/-dev\1/'
  GITHUB_REF_NAME: '{{ .GITHUB_REF_NAME | default "dev" }}'
  CLEANED_REF_NAME: '{{ regexReplaceAll "[/_]" .GITHUB_REF_NAME "-" }}'
  IMAGE_TAG: '{{ .IMAGE_TAG | default (regexReplaceAll "(\\d+)-merge" .CLEANED_REF_NAME "pr-${1}") }}'
  KUBECONFIG_PATH: ./kubeconfig-integration
  # operator-sdk image used to generate the OLM bundle (olm:bundle) and run
  # scorecard against it (olm:scorecard); the two must use the same version.
  # renovate: datasource=docker depName=quay.io/operator-framework/operator-sdk versioning=docker
  OPERATOR_SDK_IMAGE_VERSION: v1.42.3@sha256:b7378eb179b97fbdf1ff1304e86f62e9ff9f9c2d0089464111ce8eddd39e2013
  # Red Hat Preflight image used by olm:preflight-container (check container, in
  # the Dagger engine) and olm:preflight-operator (check operator, host-side);
  # the two must use the same version.
  # renovate: datasource=docker depName=quay.io/opdev/preflight versioning=docker
  PREFLIGHT_VERSION: 1.21.0@sha256:a5ee1785e7def527aec34573e19e8e4959341d378a8f3e92f0f8fba35fc23304
  # Tag suffix of the UBI variant of the operator image, as produced by the
  # "ubi" target of operator/docker-bake.hcl. The OLM bundle ships the UBI
  # image, since that is the variant submitted to Red Hat certification.
  UBI_TAG_SUFFIX: '-ubi9'
  ALLOWED_ENVS: [testing, production]

tasks:

  ####################################
  ## ALL
  ####################################

  all:ci:
    desc: Run the CI pipeline
    deps:
      - all:commitlint
      - core:ci
      - documentation:ci
      - operator:ci
      - grafana:ci

  all:commitlint:
    desc: Check for conventional commits
    env:
      # renovate: datasource=git-refs depName=commitlint lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_COMMITLINT_SHA: 26cd57fb6ad66e88c036b675b0478d38df93962d
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/commitlint@${DAGGER_COMMITLINT_SHA}
        lint --source . --args "--from=origin/main" stdout

  all:publish:
    desc: Publish the release artifacts
    deps:
      - core:goreleaser-publish
      - core:containerize-publish
      - operator:containerize-publish
      - operator:helm-publish

  ####################################
  ## CORE
  ####################################

  core:ci:
    desc: Run the core CI pipeline
    deps:
      - core:lint
      - core:protolint
      - core:protoc-gen-go-grpc
      - core:go-test
      - core:containerize-snapshot
      - core:uncommitted

  core:lint:
    desc: Run golangci-lint on core
    deps:
      - core:protoc-gen-go-grpc
    cmds:
      - task: internal:lint
        vars:
          WORKDIR: "core"
    sources:
      - core/**/*.go

  core:protolint:
    desc: Run protolint
    dir: core
    run: once
    env:
      # renovate: datasource=git-refs depName=protolint lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_PROTOLINT_SHA: 26cd57fb6ad66e88c036b675b0478d38df93962d
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/protolint@${DAGGER_PROTOLINT_SHA}
        lint --source . --args "--config_path=.protolint.yaml" --args proto/ stdout
    sources:
      - proto/**/*.proto

  core:protoc-gen-go-grpc:
    desc: Compile proto files
    deps:
      - core:protolint
    dir: core
    run: once
    env:
      # renovate: datasource=git-refs depName=protoc-gen-go-grpc lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_PROTOC_GEN_GO_GRPC_SHA: 26cd57fb6ad66e88c036b675b0478d38df93962d
    cmds:
      - >
        GITHUB_REF= dagger -s call
        -m github.com/cloudnative-pg/daggerverse/protoc-gen-go-grpc@${DAGGER_PROTOC_GEN_GO_GRPC_SHA}
        run --source . --go-opt module=github.com/cloudnative-pg/klio/core/internal/grpc
        --go-grpcopt module=github.com/cloudnative-pg/klio/core/internal/grpc --proto-path proto -o internal/grpc/
    sources:
      - proto/**/*.proto

  core:clean:
    desc: Cleanup of the core build artifacts
    dir: core
    cmds:
      - rm -rf internal/grpc/*.pb.go

  core:go-test:
    desc: Run go test
    deps:
      - core:protoc-gen-go-grpc
    cmds:
      - task: internal:go-test
        vars:
          WORKDIR: "core"
    sources:
      - core/**/*.go

  core:goreleaser-snapshot:
    desc: Build snapshot packages
    deps:
      - core:protoc-gen-go-grpc
    vars:
      # renovate: datasource=github-tags depName=goreleaser/goreleaser versioning=semver
      GORELEASER_VERSION: v2.17.1
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0@sha256:65b6f280bf050ec5af12716857e8ea8439d694dbba8f31ceeb7630670071f2bb
    run: once
    cmds:
      # Goreleaser needs the .git directory to figure out the version from the tags.
      # Given that it is easier to have .goreleaser.yaml in the core directory, we
      # run goreleaser from there, mounting the whole repository as /src and
      # setting the workdir to /src/core.
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-mounted-cache --cache go-mod --path "/go/pkg/mod"
        with-env-variable --name GOMODCACHE --value /go/pkg/mod
        with-mounted-cache --cache go-build --path "/root/.cache/go-build"
        with-env-variable --name GOCACHE --value /root/.cache/go-build
        with-exec --args sh --args '-c' --args 'curl -sfL -o /tmp/goreleaser.tar.gz https://github.com/goreleaser/goreleaser/releases/download/{{ .GORELEASER_VERSION }}/goreleaser_Linux_$(uname -m | sed s/aarch64/arm64/).tar.gz'
        with-exec --args sh --args '-c' --args 'tar -xzf /tmp/goreleaser.tar.gz -C /usr/local/bin goreleaser'
        with-mounted-directory --path /src --source .
        with-workdir --path /src/core
        with-exec --args sh --args '-c' --args 'goreleaser release --clean --snapshot --config .goreleaser.yaml --skip=publish'
        directory --path .
        filter --include dist
        export --path core

      # TODO: revert this workaround when https://github.com/dagger/dagger/issues/6387 is fixed.
      # "directory --path dist export --path dist" should work properly but it creates the dist/
      # directory with wrong permissions (0700).
    sources:
      - ./**/*
      - exclude: dist/**/*

  core:goreleaser-publish:
    desc: Upload the release artifacts
    deps:
      - core:protoc-gen-go-grpc
      - core:uncommitted
    run: once
    requires:
      # We expect this to run in a GitHub workflow, so we put a few GitHub-specific vars here
      # to prevent running this task locally by accident.
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
        - GITHUB_TOKEN
    preconditions:
      - sh: "[[ {{.GITHUB_REF}} =~ 'refs/tags/v.*' ]]"
        msg: not a tag, failing
    vars:
      # renovate: datasource=github-tags depName=goreleaser/goreleaser versioning=semver
      GORELEASER_VERSION: v2.17.1
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0@sha256:65b6f280bf050ec5af12716857e8ea8439d694dbba8f31ceeb7630670071f2bb
    cmds:
      # Goreleaser needs the .git directory to figure out the version from the tags.
      # Given that it is easier to have .goreleaser.yaml in the core directory, we
      # run goreleaser from there, mounting the whole repository as /src and
      # setting the workdir to /src/core.
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-mounted-cache --cache go-mod --path "/go/pkg/mod"
        with-env-variable --name GOMODCACHE --value /go/pkg/mod
        with-mounted-cache --cache go-build --path "/root/.cache/go-build"
        with-env-variable --name GOCACHE --value /root/.cache/go-build
        with-exec --args sh --args '-c' --args 'curl -sfL -o /tmp/goreleaser.tar.gz https://github.com/goreleaser/goreleaser/releases/download/{{ .GORELEASER_VERSION }}/goreleaser_Linux_$(uname -m | sed s/aarch64/arm64/).tar.gz'
        with-exec --args sh --args '-c' --args 'tar -xzf /tmp/goreleaser.tar.gz -C /usr/local/bin goreleaser'
        with-mounted-directory --path /src --source .
        with-workdir --path /src/core
        with-env-variable --name GITHUB_TOKEN --value {{.GITHUB_TOKEN }}
        with-exec --args sh --args '-c' --args 'goreleaser release --clean --config .goreleaser.yaml'
        directory --path .
        filter --include dist
        export --path core

  core:containerize-snapshot:
    desc: Snapshot container images
    dir: core
    deps:
      - core:goreleaser-snapshot
      - internal:start-registry
    vars:
      TAG: '{{ .TAG | default .IMAGE_TAG }}'
      GITHUB_ACTIONS: '{{ .GITHUB_ACTIONS }}'
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "testing"
          INSECURE: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
          REGISTRY: '{{ if .GITHUB_ACTIONS }}ghcr.io/cloudnative-pg{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
          VERSION: "{{ .TAG }}"
          LATEST: "false"
          WORKDIR: "core"

  core:containerize-main:
    desc: Push the production core image for the main branch
    dir: core
    deps:
      - core:goreleaser-snapshot
      - internal:start-registry
    requires:
      # These GitHub-specific vars are present only in a workflow run. Requiring
      # them prevents pushing the production :main image from a local run by
      # accident.
      vars:
        - CI
        - GITHUB_REF
    preconditions:
      - sh: '[ "{{.GITHUB_REF}}" = "refs/heads/main" ]'
        msg: not on the main branch, failing
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "production"
          INSECURE: "false"
          REGISTRY: "ghcr.io/cloudnative-pg"
          VERSION: "main"
          LATEST: "false"
          WORKDIR: "core"

  core:containerize-publish:
    desc: Publish container images
    deps:
      - core:goreleaser-publish
    requires:
      # We expect this to run in a GitHub workflow, so we put a few GitHub-specific vars here
      # to prevent running this task locally by accident.
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
    preconditions:
      - sh: "[[ {{.GITHUB_REF}} =~ 'refs/tags/v.*' ]]"
        msg: not a tag, failing
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "production"
          REGISTRY: "ghcr.io/cloudnative-pg"
          INSECURE: "false"
          VERSION: "{{ .GITHUB_REF_NAME }}"
          LATEST: "true"
          WORKDIR: "core"

  core:licenses:
    desc: Generate core licenses
    cmds:
      - task: internal:licenses
        vars:
          WORKDIR: "core"
    sources:
      - ./**/*

  core:uncommitted:
    desc: Check for uncommitted changes
    deps:
        - core:protoc-gen-go-grpc
    cmds:
      - task: internal:uncommitted
    sources:
      - ./**/*

  ####################################
  ## INTERNAL
  ####################################

  internal:generate-certs:
    desc: Generate certificates for the local registry
    run: once
    internal: true
    cmds:
      - >
        mkdir -p certs &&
        docker volume create {{ .REGISTRY_CERT_VOLUME }} &&
        docker run -v {{ .REGISTRY_CERT_VOLUME }}:/certs -w /certs --name certs-klio --entrypoint=/bin/sh alpine/openssl -c '
        openssl genrsa -out ca-key.pem 4096 &&
        openssl req -new -x509 -days 365 -key ca-key.pem -sha256 -out ca.pem \
            -subj "/O=CloudNativePG/OU=Barman Cloud Plugin Testing" &&
        openssl genrsa -out server-key.pem 4096 &&
        openssl req -subj "/CN={{ .REGISTRY_NAME }}" -sha256 -new -key server-key.pem -out server.csr &&
        echo subjectAltName = DNS:{{ .REGISTRY_NAME }},IP:127.0.0.1 >> extfile.cnf &&
        echo extendedKeyUsage = serverAuth >> extfile.cnf &&
        openssl x509 -req -days 365 -sha256 -in server.csr -CA ca.pem -CAkey ca-key.pem \
            -CAcreateserial -out server-cert.pem -extfile extfile.cnf'
        docker cp certs-klio:/certs/ca.pem certs/ca.pem &&
        docker rm certs-klio
    status:
      - docker volume inspect {{ .REGISTRY_CERT_VOLUME }}
      - test -f certs/ca.pem

  internal:start-build-network:
    desc: Create a docker network for image building used by the dagger engine and the registry
    internal: true
    run: once
    cmds:
      - docker network create {{ .REGISTRY_NETWORK}}
    status:
      - docker network inspect {{ .REGISTRY_NETWORK }}

  internal:start-registry:
    desc: Start a container registry
    internal: true
    run: once
    deps:
      - internal:generate-certs
      - internal:start-build-network
    env:
      # renovate: datasource=docker depName=registry versioning=docker
      REGISTRY_VERSION: 3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
    cmds:
      - >
        docker run -d --name {{ .REGISTRY_NAME }}
        --network {{ .REGISTRY_NETWORK }}
        -v {{ .REGISTRY_CERT_VOLUME }}:/certs
        -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server-cert.pem -e REGISTRY_HTTP_TLS_KEY=/certs/server-key.pem
        registry:${REGISTRY_VERSION}
    status:
      - \[ "$(docker inspect -f {{`'{{.State.Running}}'`}} "{{ .REGISTRY_NAME }}" 2> /dev/null)" == 'true' \]

  internal:registry-network-connect:
    desc: Make sure the registry is connected to the registry network
    summary: If we started the registry on our own, it should already be connected. However, if the registry was started
      somewhere else, it may not be on the expected network.
    internal: true
    deps:
      - internal:start-registry
    run: once
    cmds:
      - docker network connect {{ .REGISTRY_NETWORK }} {{ .REGISTRY_NAME }} || true
    status:
      - docker network inspect {{ .REGISTRY_NETWORK }} -f '{{ range .Containers }}{{ .Name }} {{ end }}' | grep "{{ .REGISTRY_NAME }}"

  internal:create-builder:
    desc: Create a buildx builder
    internal: true
    run: once
    deps:
      - internal:start-build-network
    cmds:
      - dagger run docker buildx create --name {{ .BUILDER_NAME }} --driver-opt "network={{ .REGISTRY_NETWORK }}"
    status:
      - docker buildx inspect {{ .BUILDER_NAME }}

  internal:containerize:
    desc: Build container images
    dir: '{{ .WORKDIR }}'
    deps:
      - internal:create-builder
      - internal:registry-network-connect
    internal: true
    requires:
      vars:
        - name: ENVIRONMENT
          enum:
            ref: .ALLOWED_ENVS
        - REGISTRY
        - INSECURE
        - VERSION
        - LATEST
        - WORKDIR
    env:
      environment: "{{ .ENVIRONMENT }}"
      registry: "{{ .REGISTRY }}"
      insecure: "{{ .INSECURE }}"
      version: "{{ .VERSION }}"
      latest: "{{ .LATEST }}"
    cmds:
      - dagger run docker buildx bake --builder {{ .BUILDER_NAME }} --push --metadata-file metadata.json

  internal:lint:
    desc: Run golangci-lint
    env:
      # renovate: datasource=git-refs depName=golangci-lint lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_GOLANGCI_LINT_SHA: ff27cd50f6b4eed2e3753c520632cd6099e1ce52
      # renovate: datasource=docker depName=golangci/golangci-lint versioning=docker
      GOLANGCI_LINT_VERSION: v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
    internal: true
    dir: '{{ .WORKDIR }}'
    cmds:
      - >
        echo $(pwd);
        GITHUB_REF= dagger -c
        "github.com/sagikazarmark/daggerverse/golangci-lint@${DAGGER_GOLANGCI_LINT_SHA}
        --version ${GOLANGCI_LINT_VERSION} | run . --config .golangci.yml | stdout"

  internal:go-test:
    desc: Run go test
    internal: true
    dir: '{{ .WORKDIR }}'
    env:
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0@sha256:65b6f280bf050ec5af12716857e8ea8439d694dbba8f31ceeb7630670071f2bb
      # renovate: datasource=custom.envtest depName=kubernetes packageName=https://github.com/kubernetes/kubernetes versioning=semver
      K8S_VERSION: 1.36.2
      # renovate: datasource=git-refs depName=controller-runtime packageName=https://github.com/kubernetes-sigs/controller-runtime versioning=semver
      SETUP_ENVTEST_VERSION: 0.24.1
    cmds:
      # TODO: move this out of the plugin repo and into the daggerverse
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/plugin-barman-cloud/dagger/gotest
        --go-version ${GOLANG_IMAGE_VERSION}
        --kube-version ${K8S_VERSION}
        --setup-envtest-version ${SETUP_ENVTEST_VERSION}
        unit-test --src .

  internal:uncommitted:
    desc: Check for uncommitted changes
    internal: true
    env:
      # renovate: datasource=git-refs depName=uncommitted lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_UNCOMMITTED_SHA: 26cd57fb6ad66e88c036b675b0478d38df93962d
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/uncommitted@${DAGGER_UNCOMMITTED_SHA}
        check-uncommitted --source . stdout

  internal:licenses:
    desc: Generate licenses
    internal: true
    dir: '{{ .WORKDIR }}'
    env:
      # renovate: datasource=git-refs depName=go-licenses lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_GO_LICENSES: 838ccbbd35b0e5e9a7d4af600fa8fa1a4259b1d0
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/go-licenses@${DAGGER_GO_LICENSES}
        go-licenses --source . --args "save" --args "./..." --args "--force"
        --args "--save_path=licenses/go-licenses" --args "--ignore=github.com/cloudnative-pg/klio"
        directory --path licenses/ export --path licenses/

  ####################################
  ## OPERATOR
  ####################################

  operator:ci:
    desc: Run the operator CI pipeline
    deps:
      - operator:lint
      - operator:go-test
      - operator:controller-gen
      - operator:containerize-snapshot
      - operator:helm-chart
      - operator:helm-lint
      - operator:uncommitted

  operator:lint:
    desc: Run golangci-lint on operator
    cmds:
      - task: internal:lint
        vars:
          WORKDIR: "operator"
    sources:
      - ./**/*.go

  operator:go-test:
    desc: Run go test
    deps:
      - operator:controller-gen
    cmds:
      - task: internal:go-test
        vars:
          WORKDIR: "operator"
    sources:
      - operator/**/*.go

  operator:containerize-snapshot:
    desc: Snapshot container images
    dir: operator
    deps:
      - internal:start-registry
      - operator:controller-gen
    vars:
      TAG: '{{ .TAG | default .IMAGE_TAG }}'
      GITHUB_ACTIONS: '{{ .GITHUB_ACTIONS }}'
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "testing"
          INSECURE: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
          REGISTRY: '{{ if .GITHUB_ACTIONS }}ghcr.io/cloudnative-pg{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
          VERSION: "{{ .TAG }}"
          LATEST: "false"
          WORKDIR: "operator"

  operator:containerize-main:
    desc: Push the production operator image for the main branch
    dir: operator
    deps:
      - internal:start-registry
      - operator:controller-gen
    requires:
      # These GitHub-specific vars are present only in a workflow run. Requiring
      # them prevents pushing the production :main image from a local run by
      # accident.
      vars:
        - CI
        - GITHUB_REF
    preconditions:
      - sh: '[ "{{.GITHUB_REF}}" = "refs/heads/main" ]'
        msg: not on the main branch, failing
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "production"
          INSECURE: "false"
          REGISTRY: "ghcr.io/cloudnative-pg"
          VERSION: "main"
          LATEST: "false"
          WORKDIR: "operator"

  operator:containerize-publish:
    desc: Publish operator images
    requires:
      # We expect this to run in a GitHub workflow, so we put a few GitHub-specific vars here
      # to prevent running this task locally by accident.
      vars:
        - CI
        - GITHUB_REPOSITORY
        - GITHUB_REF
        - GITHUB_REF_NAME
    preconditions:
      - sh: "[[ {{.GITHUB_REF}} =~ 'refs/tags/v.*' ]]"
        msg: not a tag, failing
    cmds:
      - task: internal:containerize
        vars:
          ENVIRONMENT: "production"
          REGISTRY: "ghcr.io/cloudnative-pg"
          INSECURE: "false"
          VERSION: "{{ .GITHUB_REF_NAME }}"
          LATEST: "true"
          WORKDIR: "operator"

  operator:controller-gen:
    desc: Run controller-gen
    dir: operator
    run: once
    env:
      # renovate: datasource=git-refs depName=controller-gen lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_CONTROLLER_GEN_SHA: 26cd57fb6ad66e88c036b675b0478d38df93962d
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0@sha256:65b6f280bf050ec5af12716857e8ea8439d694dbba8f31ceeb7630670071f2bb
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/controller-gen@${DAGGER_CONTROLLER_GEN_SHA}
        --go-image golang:${GOLANG_IMAGE_VERSION}
        controller-gen --source . --args object:headerFile=hack/boilerplate.go.txt --args paths=./api/...
        file --path api/v1alpha1/zz_generated.deepcopy.go export --path api/v1alpha1/zz_generated.deepcopy.go
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/controller-gen@${DAGGER_CONTROLLER_GEN_SHA}
        --go-image golang:${GOLANG_IMAGE_VERSION}
        controller-gen --source . --args rbac:roleName=manager-role --args crd --args webhook
        --args paths=./api/... --args paths=./internal/... --args output:crd:artifacts:config=config/crd/bases
        directory --path config/
        filter --include crd/bases/,rbac/
        export --path config/
    sources:
      - ./api/**/*.go
      - ./internal/**/*.go
    generates:
      - ./api/v1alpha1/zz_generated.deepcopy.go
      - ./config/rbac/role.yaml
      - ./config/crd/bases/*.yaml

  operator:helm-chart:
    desc: Generate the Helm chart for the operator
    deps:
      - operator:controller-gen
    dir: operator
    run: once
    env:
      # renovate: datasource=git-refs depName=kustomize lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_KUSTOMIZE_SHA: ff27cd50f6b4eed2e3753c520632cd6099e1ce52
      # renovate: datasource=docker depName=registry.k8s.io/kustomize/kustomize versioning=docker
      KUSTOMIZE_IMAGE_VERSION: v5.8.1@sha256:899fcd3bc898160e62bcaf82932b0cb29ba38d16272353db2e7acbba82129429
    cmds:
      # Generate the Helm chart for the operator.
      # Kubebuilder wants to generate the CRDs in the chart/templates/crd directory, but we want to
      # generate them in the chart/crds directory, as the Helm convention is that CRDs should not be templates.
      # We build the CRDs in a second step with kustomize.
      # We filter out the templates that are managed manually, so we don't override them.
      - >
        GITHUB_REF= dagger -s call -m dagger/helmify
        run --source ./config
        filter
        --exclude templates/certmanager
        --exclude templates/deployment.yaml
        --exclude templates/service.yaml
        --exclude templates/metrics-service.yaml
        --exclude templates/prometheus.yaml
        --exclude .helmignore
        --exclude Chart.yaml
        --exclude values.yaml
        export --path dist/chart
    sources:
      - config/**/*
    generates:
      - dist/**

  operator:helm-lint:
    desc: Lint the Helm chart for the operator
    dir: operator
    run: once
    deps:
      - operator:helm-chart
    env:
      # renovate: datasource=git-refs depName=helm lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_HELM_SHA: ff27cd50f6b4eed2e3753c520632cd6099e1ce52
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/helm@${DAGGER_HELM_SHA}
        lint --chart dist/chart/ stdout
    sources:
      - dist/chart/**/*

  operator:helm-publish:
    desc: Publish the Helm chart for the operator as an OCI artifact
    dir: operator
    run: once
    deps:
      - operator:helm-chart
    requires:
      # We expect this to run in a GitHub workflow, so we put a few GitHub-specific vars here
      # to prevent running this task locally by accident.
      vars:
        - CI
        - GITHUB_ACTOR
        - GITHUB_TOKEN
    env:
      # renovate: datasource=git-refs depName=helm lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_HELM_SHA: ff27cd50f6b4eed2e3753c520632cd6099e1ce52
      GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
    cmds:
      # Nothing should have changed in the chart, so we can use the uncommitted task to check for changes.
      - task: internal:uncommitted
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/helm@${DAGGER_HELM_SHA}
        package --chart dist/chart/
        with-name --name klio_chart.tgz
        export --path dist/chart/ --allow-parent-dir-path
      # TODO: sign the chart
      # Pushing the chart to the registry. It automatically gets the name and the
      # version from the Chart.yaml file.
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/helm@${DAGGER_HELM_SHA}
        with-registry-auth --address "ghcr.io/cloudnative-pg" --username "{{ .GITHUB_ACTOR }}" --secret env://GITHUB_TOKEN
        push --pkg dist/chart/klio_chart.tgz
        --registry "oci://ghcr.io/cloudnative-pg/"
    sources:
      - dist/chart/**/*

  operator:uncommitted:
    desc: Check for uncommitted changes after chart generation
    deps:
      - operator:helm-chart
    cmds:
      - task: internal:uncommitted
    sources:
      - ./**/*

  operator:licenses:
    desc: Generate operator licenses
    cmds:
      - task: internal:licenses
        vars:
          WORKDIR: "operator"
    sources:
      - ./**/*

  ####################################
  ## OLM
  ####################################

  olm:all:
    desc: Generate the OLM bundle, catalog image, and CatalogSource YAML
    requires:
      vars:
        - name: ENVIRONMENT
          enum:
            ref: .ALLOWED_ENVS
    deps:
      - olm:catalog
      - olm:catalog-source
      - olm:scorecard

  olm:manifest:
    run: once
    internal: true
    requires:
      vars:
        - name: ENVIRONMENT
          enum:
            ref: .ALLOWED_ENVS
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/cloudnative-pg{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
      ubi_suffix: '{{ .UBI_TAG_SUFFIX }}'
      # renovate: datasource=git-refs depName=kustomize lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_KUSTOMIZE_SHA: ff27cd50f6b4eed2e3753c520632cd6099e1ce52
    cmds:
      # Generate the kustomize patch that bakes the operand (sidecar) image into
      # the operator Deployment as the SIDECAR_IMAGE env var, so the OLM
      # Subscription does not need to set it. The operand shares the operator's
      # registry and tag, differing only by the "klio" repository instead of
      # "klio-operator". The patch is consumed by
      # operator/config/olm-default/kustomization.yaml.
      - |
        cat > operator/config/olm-default/manager_sidecar_image_patch.yaml <<EOF
        - op: add
          path: /spec/template/spec/containers/0/env
          value:
            - name: SIDECAR_IMAGE
              value: ${registry}/klio${suffix}:${tag}
        EOF
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/kustomize@${DAGGER_KUSTOMIZE_SHA}
        edit --source .
        --dir operator/config/manifests
        set image --image controller=${registry}/klio-operator${suffix}:${tag}${ubi_suffix}
        directory directory --path operator/config/manifests export --path operator/config/manifest-build
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/kustomize@${DAGGER_KUSTOMIZE_SHA}
        build --source operator/config --dir manifest-build
        export --path operator/olm-manifests/manifest.yaml

    sources:
      - operator/config/**/*
    generates:
      - operator/olm-manifests/manifest.yaml

  olm:bundle:
    desc: Generate the OLM bundle for the operator
    run: once
    deps:
      - olm:manifest
    cmds:
      - >
        docker
        run --rm
        -u $(id -u)
        -v $(pwd)/operator:/operator
        -w /operator/
        quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        generate bundle
        --input-dir olm-manifests/
        --kustomize-dir config/manifests
        --version {{ .GIT_TAG_VERSION }}
    sources:
      - operator/olm-manifests/**
    generates:
      - bundle/

  olm:build:
    desc: Build the require OLM bundle image after generating the bundle
    requires:
      vars:
        - name: ENVIRONMENT
          enum:
            ref: .ALLOWED_ENVS
    deps:
      - internal:create-builder
      - internal:registry-network-connect
      - olm:bundle
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/cloudnative-pg{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
    cmds:
      - >
        docker buildx build
        --builder {{ .BUILDER_NAME }}
        --push
        --platform linux/amd64,linux/arm64
        -t ${registry}/klio-operator${suffix}:${tag}-bundle
        -f operator/bundle.Dockerfile
        --output="type=image,registry.insecure=${insecure}"
        operator/

  olm:catalog-file:
    internal: false
    run: once
    deps:
        - olm:build
    requires:
      vars:
        - name: ENVIRONMENT
          enum:
            ref: .ALLOWED_ENVS
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/cloudnative-pg{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
      # renovate: datasource=docker depName=quay.io/operator-framework/opm versioning=docker
      OPM_IMAGE_VERSION: v1.73.0@sha256:e5a6220603fb4504d58c6e3e488386b817e3695c906a62ee0370b5faedc3799a
      CONTAINER_AUTH_FILE: '{{ .REGISTRY_AUTH_FILE | default (printf "%s/.docker/config.json" (env "HOME")) }}'
    cmds:
      - >
        mkdir -p operator/catalog/klio-operator
      - >
        echo '{"default":[{"type":"insecureAcceptAnything"}]}' > /tmp/policy.json
      - >
        docker
        run --rm
        -u $(id -u)
        -v $(pwd)/operator/:/operator/
        -w /operator/
        quay.io/operator-framework/opm:${OPM_IMAGE_VERSION}
        generate dockerfile catalog
      - |
        cat << EOF > operator/klio-operator-template.yaml
        Schema: olm.semver
        GenerateMajorChannels: true
        GenerateMinorChannels: false
        Stable:
          Bundles:
          - Image: ${registry}/klio-operator${suffix}:${tag}-bundle
        EOF
      - >
        docker
        run --rm
        --network {{ .REGISTRY_NETWORK }}
        -v /tmp/policy.json:/etc/containers/policy.json
        -v ${CONTAINER_AUTH_FILE}:/.config/containers/auth.json
        -u $(id -u)
        -v $(pwd)/operator/:/operator/
        -w /operator/
        quay.io/operator-framework/opm:${OPM_IMAGE_VERSION}
        alpha render-template semver --skip-tls-verify -o yaml klio-operator-template.yaml > operator/catalog/klio-olm-template.yaml
      - >
        docker
        run --rm
        -u $(id -u)
        -v $(pwd)/operator/:/operator/
        -w /operator/
        quay.io/operator-framework/opm:${OPM_IMAGE_VERSION}
        validate catalog/
    generates:
      - operator/catalog.Dockerfile
      - operator/catalog
      - operator/klio-olm-template.yaml

  olm:catalog:
    desc: Build the OLM catalog image after the bundle image is built
    requires:
      vars:
        - name: ENVIRONMENT
          enum:
            ref: .ALLOWED_ENVS
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/cloudnative-pg{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
    deps:
      - olm:catalog-file
    cmds:
      - >
        docker buildx build
        --builder {{ .BUILDER_NAME }}
        --push
        --platform linux/amd64,linux/arm64
        -t ${registry}/klio-operator${suffix}:${tag}-catalog
        -f operator/catalog.Dockerfile
        --output="type=image,registry.insecure=${insecure}"
        operator/

  olm:catalog-source:
    desc: Build the OLM CatalogSource YAML file
    requires:
      vars:
        - name: ENVIRONMENT
          enum:
            ref: .ALLOWED_ENVS
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/cloudnative-pg{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      insecure: '{{ if .GITHUB_ACTIONS }}false{{ else }}true{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
    cmds:
      - |
        cat << EOF > operator/klio-operator-catalog-source.yaml
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
           name: klio-catalog
           namespace: openshift-marketplace
        spec:
           sourceType: grpc
           image: ${registry}/klio-operator${suffix}:${tag}-catalog
        EOF

  olm:preflight-container:
    desc: Run Red Hat Preflight (check container) certification on the operator image
    dir: operator
    run: once
    requires:
      vars:
        # IMAGE is the fully-qualified operator image to certify. It must already
        # be published to a registry (e.g. by `operator:containerize-snapshot`)
        # and is supplied by the caller, who knows the image it just pushed (for
        # CI, read from operator/metadata.json). Requiring it here avoids
        # re-deriving the image name per environment.
        - IMAGE
    env:
      # REGISTRY_AUTH_FILE is the registry credentials file used to pull the
      # image under test (same convention as the OLM tasks). The published
      # ghcr.io images are public, so it is only needed for private or local
      # registries.
      REGISTRY_AUTH_FILE: '{{ .REGISTRY_AUTH_FILE | default (printf "%s/.docker/config.json" (env "HOME")) }}'
    # Preflight runs and the results are evaluated entirely inside the Dagger
    # engine: the `verdict` call fails on a non-passing check. Nothing is
    # written to the host.
    cmds:
      - |
        set -euo pipefail
        # Scope the credentials handed to the third-party preflight image down
        # to the one registry IMAGE is pulled from, rather than its whole
        # config: REGISTRY_AUTH_FILE may hold unrelated registries' auth too.
        # Require an inline auth entry rather than merely a file: Docker Desktop
        # on macOS writes a config holding only {"credsStore":"desktop"}, whose
        # helper binary preflight cannot invoke. The image is public, so falling
        # back to an anonymous pull is correct.
        docker_config_arg=""
        if [ -f "${REGISTRY_AUTH_FILE}" ]; then
          image="{{ .IMAGE }}"
          registry_host="${image%%/*}"
          scoped_dockerconfig="$(mktemp)"
          trap 'rm -f "${scoped_dockerconfig}"' EXIT
          jq --arg reg "${registry_host}" \
            '{auths: ((.auths // {}) | to_entries | map(select(.key == $reg and .value.auth)) | from_entries)}' \
            "${REGISTRY_AUTH_FILE}" > "${scoped_dockerconfig}"
          if jq -e '.auths | length > 0' "${scoped_dockerconfig}" >/dev/null 2>&1; then
            docker_config_arg="--docker-config file://${scoped_dockerconfig}"
          fi
        fi
        GITHUB_REF= dagger call -m dagger/preflight \
          --preflight-image quay.io/opdev/preflight:{{ .PREFLIGHT_VERSION }} \
          check-container --image "{{ .IMAGE }}" ${docker_config_arg} verdict

  olm:preflight-operator:
    desc: Run Red Hat Preflight (check operator) certification against a live OpenShift cluster
    summary: |
      Runs `preflight check operator` against the OLM bundle already published
      for this build, installing it through OLM into the OpenShift cluster
      referenced by EXTERNAL_KUBECONFIG (CRC locally / in the OpenShift E2E CI
      job) and evaluating the verdict in the Dagger engine.

      Unlike check container, check operator needs a live OpenShift cluster
      (OLM, SCC), which the Dagger engine cannot reach, so preflight runs
      host-side against EXTERNAL_KUBECONFIG (like the other CRC tasks) and only
      the pass/fail verdict is evaluated in-engine via the preflight module.

      The checks are always evaluated locally; nothing is ever submitted to
      Red Hat.
    dir: operator
    run: once
    requires:
      vars:
        # EXTERNAL_KUBECONFIG points at the OpenShift (CRC) cluster preflight
        # installs the operator into. Named like the other CRC tasks so a run
        # can share the same cluster.
        - EXTERNAL_KUBECONFIG
        - name: ENVIRONMENT
          enum:
            ref: .ALLOWED_ENVS
    env:
      registry: '{{ if .GITHUB_ACTIONS }}ghcr.io/cloudnative-pg{{ else }}{{ .REGISTRY_NAME }}:{{ .REGISTRY_PORT }}{{ end }}'
      suffix: '{{ if ( ne .ENVIRONMENT "production" ) }}-testing{{end}}'
      tag: '{{ .TAG | default .IMAGE_TAG }}'
      # REGISTRY_AUTH_FILE is the registry credentials file preflight uses for
      # its bundle and index pulls (same convention as the other OLM tasks). The
      # ghcr.io images are public, so it is optional and skipped when absent,
      # but an authenticated pull avoids the per-IP anonymous rate limit shared
      # across GitHub Actions runners. CI populates it with `docker login`.
      REGISTRY_AUTH_FILE: '{{ .REGISTRY_AUTH_FILE | default (printf "%s/.docker/config.json" (env "HOME")) }}'
      # Export EXTERNAL_KUBECONFIG (otherwise only a required var) so the recipe
      # below can reference it: with `set -u` an unexported var passed on the
      # command line rather than via the environment would abort as unbound.
      EXTERNAL_KUBECONFIG: '{{ .EXTERNAL_KUBECONFIG }}'
    cmds:
      - |
        set -euo pipefail
        bundle="${registry}/klio-operator${suffix}:${tag}-bundle"
        index="${registry}/klio-operator${suffix}:${tag}-catalog"

        # Start from a clean artifacts dir so a previous run's results.json
        # cannot poison the verdict.
        artifacts="preflight-artifacts"
        rm -rf "${artifacts}"
        mkdir -p "${artifacts}"

        # preflight must reach the OpenShift API server named in the kubeconfig
        # (e.g. api.crc.testing). On Linux --network host shares the host network
        # directly (as CI does). On macOS --network host joins the Docker Desktop
        # VM instead of the host, where CRC serves the API on the host loopback,
        # so map the API hostname to the host gateway on the default bridge.
        net_args="--network host"
        if [ "$(uname -s)" = "Darwin" ]; then
          api_host="$(sed -n 's|.*server:[[:space:]]*https\{0,1\}://\([^:/]*\).*|\1|p' "${EXTERNAL_KUBECONFIG}" | head -1)"
          net_args="--add-host=${api_host}:host-gateway"
        fi

        # Hand preflight the registry credentials so the bundle and index pulls
        # are authenticated rather than anonymous, scoped to the one registry
        # they are pulled from: REGISTRY_AUTH_FILE may hold unrelated
        # registries' auth too. Require an inline auth entry rather than
        # merely a file, for the same Docker-Desktop-credential-helper reason
        # as olm:preflight-container above. The images are public, so no
        # config at all is the safe fallback.
        docker_config_args=""
        if [ -f "${REGISTRY_AUTH_FILE}" ]; then
          registry_host="${registry%%/*}"
          scoped_dockerconfig="$(mktemp)"
          trap 'rm -f "${scoped_dockerconfig}"' EXIT
          jq --arg reg "${registry_host}" \
            '{auths: ((.auths // {}) | to_entries | map(select(.key == $reg and .value.auth)) | from_entries)}' \
            "${REGISTRY_AUTH_FILE}" > "${scoped_dockerconfig}"
          if jq -e '.auths | length > 0' "${scoped_dockerconfig}" >/dev/null 2>&1; then
            docker_config_args="-e PFLT_DOCKERCONFIG=/dockerconfig -v ${scoped_dockerconfig}:/dockerconfig:ro"
          fi
        fi

        # The bundle, index and preflight images are all multi-arch, so docker
        # selects the host-architecture variant and preflight runs natively (no
        # emulation) — on an arm64 host it certifies the arm64 images end to end.
        # Run as the host user so the exported artifacts are not root-owned.
        docker run --rm ${net_args} -u "$(id -u)" -e HOME=/tmp \
          -e KUBECONFIG=/kubeconfig -v "${EXTERNAL_KUBECONFIG}:/kubeconfig:ro" \
          -e PFLT_INDEXIMAGE="${index}" \
          -e PFLT_SCORECARD_WAIT_TIME=1200 \
          -e PFLT_ARTIFACTS=/artifacts -v "$(pwd)/${artifacts}:/artifacts" \
          ${docker_config_args} \
          quay.io/opdev/preflight:{{ .PREFLIGHT_VERSION }} \
          check operator "${bundle}"
      # preflight exits non-zero only when it fails to run, not when checks fail,
      # so the verdict is derived from the artifacts in-engine.
      - GITHUB_REF= dagger call -m dagger/preflight verdict --artifacts preflight-artifacts

  olm:scorecard:
    desc: Run operator-sdk scorecard against the OLM bundle on an ephemeral k3s cluster
    summary: |
      Runs the operator-sdk scorecard basic and OLM test suites against the
      generated bundle.
    dir: operator
    run: once
    deps:
      - olm:bundle
    cmds:
      - >
        GITHUB_REF= dagger call -m dagger/scorecard
        --operator-sdk-image quay.io/operator-framework/operator-sdk:{{ .OPERATOR_SDK_IMAGE_VERSION }}
        run --bundle bundle

  olm:clean:
    desc: Cleanup of the OLM build artifacts
    cmds:
      - rm -fr operator/olm-manifests
      - rm -fr operator/bundle*
      - rm -fr operator/config/manifest-build/
      - rm -fr operator/catalog*
      - rm -fr operator/preflight-artifacts

  ####################################
  ## DOCUMENTATION
  ####################################

  documentation:ci:
    desc: Run the documentation CI pipeline
    deps:
      - documentation:cli
      - documentation:spellcheck
      - documentation:protoc-gen-doc
      - documentation:apidoc
      - documentation:helm-chart
      - documentation:docusaurus-build-test
# TODO: re-enable after first open-source release
# this task is currently failing because older versions of the documentation have not been imported.
#      - documentation:docusaurus-version-is-aligned
      - documentation:uncommitted

  documentation:cli:
    desc: Generate CLI command documentation
    run: once
    vars:
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0-alpine@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc
    cmds:
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-mounted-cache --cache go-mod --path "/go/pkg/mod"
        with-env-variable --name GOMODCACHE --value /go/pkg/mod
        with-mounted-cache --cache go-build --path "/go/build-cache"
        with-env-variable --name GOCACHE --value /go/build-cache
        with-directory --path /src --source core/ --exclude 'dist/**' --exclude 'licenses/**'
        with-workdir --path /src
        with-env-variable --name CACHEBUST --value "$(date)"
        with-exec --args sh --args '-c' --args "go run main.go gen-doc --output clidoc"
        directory --path clidoc
        export --path documentation/web/docs/user/cli/ --wipe
    sources:
      - core/cmd/**/*.go
    generates:
      - documentation/web/docs/user/cli/*.md
      - documentation/web/docs/user/cli/_category_.json

  documentation:wordlist-ordered:
    desc: Order the word list file
    dir: documentation
    run: once
    cmds:
      - LANG=C LC_ALL=C sort .wordlist.txt > .wordlist.txt.new
      - mv -f .wordlist.txt.new .wordlist.txt
    sources:
      - .wordlist.txt

  documentation:spellcheck:
    desc: Run spellcheck
    dir: documentation
    deps:
      - documentation:wordlist-ordered
      - documentation:protoc-gen-doc
    env:
      # renovate: datasource=git-refs depName=spellcheck lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_SPELLCHECK_SHA: 26cd57fb6ad66e88c036b675b0478d38df93962d
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/spellcheck@${DAGGER_SPELLCHECK_SHA}
        spellcheck --source . with-exec --use-entrypoint --args="" stdout
    sources:
      - ./**/*.md
      - ./**/*.mdx
      - .spellcheck.yaml
      - .wordlist.txt

  documentation:protoc-gen-doc:
    desc: Generate documentation from proto files
    run: once
    env:
      # renovate: datasource=git-refs depName=protoc-gen-doc lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_PROTOC_GEN_DOC_SHA: 26cd57fb6ad66e88c036b675b0478d38df93962d
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/protoc-gen-doc@${DAGGER_PROTOC_GEN_DOC_SHA}
        generate --proto-dir core/proto --doc-opt "markdown,_protocol.md" -o documentation/web/docs/developer/
    sources:
      - core/proto/**/*.proto

  documentation:apidoc:
    desc: Generate the server API documentation
    deps:
      - operator:controller-gen
    run: once
    env:
      # renovate: datasource=git-refs depName=crd-gen-refs lookupName=https://github.com/cloudnative-pg/daggerverse currentValue=main
      DAGGER_CRDGENREF_SHA: 26cd57fb6ad66e88c036b675b0478d38df93962d
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0-alpine@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/cloudnative-pg/daggerverse/crd-ref-docs@${DAGGER_CRDGENREF_SHA}
        --image golang:${GOLANG_IMAGE_VERSION}
        generate
        --src .
        --source-path operator/api/v1alpha1
        --config-file documentation/crd-gen-refs/config.yaml
        --renderer markdown
        --templates-dir documentation/crd-gen-refs/markdown
        file --path out.md
        export --path documentation/web/docs/user/api/_klio_api.md
    sources:
      - operator/api/v1alpha1/**/*
      - documentation/crd-gen-refs/**/*

  documentation:helm-chart:
    desc: Generate the the documentation for the Helm chart
    run: once
    deps:
      - operator:helm-chart
    env:
      # renovate: datasource=git-refs depName=helm-docs lookupName=https://github.com/sagikazarmark/daggerverse currentValue=main
      DAGGER_HELM_DOCS_SHA: ff27cd50f6b4eed2e3753c520632cd6099e1ce52
      # renovate: datasource=docker depName=jnorwood/helm-docs versioning=docker
      HELM_DOCS_IMAGE_VERSION: v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c
    cmds:
      - >
        GITHUB_REF= dagger -s call -m github.com/sagikazarmark/daggerverse/helm-docs@${DAGGER_HELM_DOCS_SHA}
        --version ${HELM_DOCS_IMAGE_VERSION}
        generate --chart operator/dist/chart --templates documentation/helm-docs/helm_chart.md.gotmpl
        export --path documentation/web/docs/user/_helm_chart_values.md
    sources:
      - operator/dist/chart/**/*
      - documentation/helm-docs/helm_chart.md.gotmpl
    generates:
        - documentation/web/docs/user/_helm_chart_values.md

  documentation:docusaurus-build-test:
    desc: Check that the documentation builds
    dir: documentation
    deps:
      - documentation:protoc-gen-doc
      - documentation:apidoc
      - documentation:helm-chart
      - documentation:cli
    env:
      # renovate: datasource=git-refs depName=docusaurus lookupName=https://github.com/levlaz/daggerverse currentValue=main
      DAGGER_DOCUSAURUS_SHA: 93f57fccbd5afd22fa917107ab7697f3e7db0e5a
    cmds:
      - GITHUB_REF= dagger -s call -m github.com/levlaz/daggerverse/docusaurus@${DAGGER_DOCUSAURUS_SHA}
        --src web --yarn build
    sources:
      - ./web/**/*

  documentation:docusaurus-version-is-aligned:
    desc: Verify that a documentation version exists for the current version of the plugin
    # Run a jq query that combines in an array the current release-please version and the
    # documentation versions, and checks that the release-please version is contained in the
    # documentation versions. The command returns exit code 0 if the version is found,
    # and exit code 1 otherwise.
    env:
      # renovate: datasource=docker depName=ghcr.io/jqlang/jq versioning=docker
      JQ_IMAGE_VERSION: 1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486
    cmds:
      - >
        dagger core container from --address ghcr.io/jqlang/jq:${JQ_IMAGE_VERSION}
        with-file --source .release-please-manifest.json --path /release-version.json
        with-file --source documentation/web/versions.json --path /documentation-versions.json
        with-exec --args "/jq" --args "-es" --args '.[0][] as $val | .[1] | contains([$val])'
        --args "/release-version.json" --args "/documentation-versions.json"
    sources:
      - .release-please-manifest.json
      - ./web/versions.json

  # FIXME: this times out after a few seconds. It's easier to serve the documentation through a node container.
  documentation:docusaurus-dev-serve:
    desc: Build and serve the dev documentation on http://localhost:3000
    dir: documentation
    deps:
      - documentation:protoc-gen-doc
    env:
      # renovate: datasource=git-refs depName=docusaurus lookupName=https://github.com/levlaz/daggerverse currentValue=main
      DAGGER_DOCUSAURUS_SHA: 93f57fccbd5afd22fa917107ab7697f3e7db0e5a
    cmds:
      # Ctrl-C to terminate the
      - >
        dagger call -m github.com/levlaz/daggerverse/docusaurus@${DAGGER_DOCUSAURUS_SHA}
        --src web --yarn serve-dev up

  documentation:uncommitted:
    desc: Check for uncommitted changes after documentation generation
    deps:
      - documentation:wordlist-ordered
      - documentation:protoc-gen-doc
      - documentation:apidoc
      - documentation:helm-chart
      - documentation:cli
    cmds:
      - task: internal:uncommitted
    sources:
      - ./**/*

  documentation:clean:
    desc: Cleanup of the documentation build artifacts and modules
    dir: documentation
    cmds:
      - rm -rf web/build
      - rm -rf web/docs/developer/protocol.md
      - rm -rf web/node_modules

  ####################################
  ## GRAFANA
  ####################################

  grafana:ci:
    desc: Run the Grafana dashboard CI pipeline
    deps:
      - grafana:go-test
      - grafana:lint-builder
      - grafana:lint-dashboard
      - grafana:uncommitted

  grafana:gen:
    desc: Generate the Grafana dashboard JSON
    run: once
    vars:
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0-alpine@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc
    cmds:
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-mounted-cache --cache go-mod --path "/go/pkg/mod"
        with-env-variable --name GOMODCACHE --value /go/pkg/mod
        with-mounted-cache --cache go-build --path "/go/build-cache"
        with-env-variable --name GOCACHE --value /go/build-cache
        with-directory --path /src --source observability/grafana/
        with-workdir --path /src
        with-env-variable --name CACHEBUST --value "$(date)"
        with-exec --args sh --args '-c' --args "go run . -output klio-dashboard.json"
        file --path klio-dashboard.json
        export --path observability/grafana/klio-dashboard.json
    sources:
      - observability/grafana/**/*.go
      - observability/grafana/go.mod
      - observability/grafana/go.sum
    generates:
      - observability/grafana/klio-dashboard.json

  grafana:go-test:
    desc: Run go test on the Grafana dashboard generator
    vars:
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0-alpine@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc
    cmds:
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-mounted-cache --cache go-mod --path "/go/pkg/mod"
        with-env-variable --name GOMODCACHE --value /go/pkg/mod
        with-mounted-cache --cache go-build --path "/go/build-cache"
        with-env-variable --name GOCACHE --value /go/build-cache
        with-directory --path /src --source observability/grafana/
        with-workdir --path /src
        with-exec --args sh --args '-c' --args "go test ./..."
        stdout
    sources:
      - observability/grafana/**/*.go
      - observability/grafana/go.mod
      - observability/grafana/go.sum

  grafana:lint-builder:
    desc: Run golangci-lint on the Grafana dashboard generator
    cmds:
      - task: internal:lint
        vars:
          WORKDIR: "observability/grafana"
    sources:
      - observability/grafana/**/*.go

  grafana:lint-dashboard:
    desc: Lint the generated Grafana dashboard JSON with gcx
    vars:
      # renovate: datasource=github-releases depName=grafana/gcx versioning=semver
      GCX_VERSION: 1.1.0
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0-alpine@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc
      # gcx dev lint only accepts the resource-as-code envelope, so the classic
      # importable dashboard JSON is wrapped on the fly. The uneditable-dashboard
      # rule is disabled on purpose: the dashboard ships editable so users can
      # tweak it after import.
      GCX_LINT_SCRIPT: >-
        set -eu;
        apk add --no-cache curl jq >/dev/null;
        ver={{ .GCX_VERSION }};
        base="https://github.com/grafana/gcx/releases/download/v${ver}";
        asset="gcx_${ver}_linux_amd64.tar.gz";
        curl -fsSL "${base}/${asset}" -o "/tmp/${asset}";
        curl -fsSL "${base}/gcx_${ver}_checksums.txt" -o /tmp/checksums.txt;
        expected=$(grep "${asset}" /tmp/checksums.txt | cut -d" " -f1);
        actual=$(sha256sum "/tmp/${asset}" | cut -d" " -f1);
        test "${expected}" = "${actual}";
        tar -xzf "/tmp/${asset}" -C /usr/local/bin gcx;
        jq "{apiVersion: \"dashboard.grafana.app/v1beta1\", kind: \"Dashboard\", metadata: {name: .uid}, spec: .}" klio-dashboard.json > /tmp/resource.json;
        gcx dev lint run --disable uneditable-dashboard /tmp/resource.json -o compact;
        n=$(gcx dev lint run --disable uneditable-dashboard /tmp/resource.json --jq ".summary.num_violations");
        echo "gcx dashboard lint violations: ${n}";
        test "${n}" = "0"
    cmds:
      - >
        dagger core container from --address golang:{{ .GOLANG_IMAGE_VERSION }}
        with-env-variable --name GCX_AGENT_MODE --value 1
        with-directory --path /src --source observability/grafana/
        with-workdir --path /src
        with-new-file --path /lint-dashboard.sh --contents '{{ .GCX_LINT_SCRIPT }}'
        with-exec --args sh --args /lint-dashboard.sh
        stdout
    sources:
      - observability/grafana/klio-dashboard.json

  grafana:uncommitted:
    desc: Check for uncommitted changes after dashboard generation
    deps:
      - grafana:gen
    cmds:
      - task: internal:uncommitted
    sources:
      - ./**/*

  ####################################
  ## CLEANUP
  ####################################

  clean:build-env:
    desc: Cleanup of the build environment
    cmds:
      - docker rm -f {{ .REGISTRY_NAME }} 2> /dev/null || true
      - docker buildx rm {{ .BUILDER_NAME }} 2> /dev/null || true
      - docker network rm {{ .REGISTRY_NETWORK }} 2> /dev/null || true
      - docker volume rm {{ .REGISTRY_CERT_VOLUME }} 2> /dev/null || true
      - rm -rf certs/

  clean:all:
    desc: Full cleanup of generated elements
    deps:
      - clean:build-env
      - documentation:clean
      - core:clean
      - olm:clean
    cmds:
      - rm -rf .task/

  ########################################
  ## INTEGRATION
  ########################################

  integration:machinery-lint:
    desc: Run golangci-lint on machinery
    cmds:
      - task: internal:lint
        vars:
          WORKDIR: "integration/tests/machinery"
    sources:
      - integration/tests/machinery/**/*.go

  integration:devenv:
    desc: Create and connect to an ephemeral development environment
    interactive: true
    deps:
      - core:containerize-snapshot
      - operator:containerize-snapshot
      - operator:helm-chart
    cmds:
      - dagger call -m integration/dagger/devenv kubernetes --source .

  integration:deploy-to-kind:
    desc: Deploy the operator on a kind cluster generated by the CNPG hack setup script
    summary: |
      Deploys the Klio operator to a Kind cluster for integration testing. This task assumes a Kind cluster has been
      previously created by the CloudNativePG hack/setup-cluster.sh script. It loads the appropriate kubeconfig,
      applies cert-manager, and installs the operator using Helm.

      The actual command is something like:

      KIND_CLUSTER_NAME=pg-operator-e2e-v1-33-1 task integration:deploy-to-kind
    deps:
      - task: core:containerize-snapshot
        vars:
          GITHUB_ACTIONS: ''
          TAG: 'dev'
      - task: operator:containerize-snapshot
        vars:
          GITHUB_ACTIONS: ''
          TAG: 'dev'
      - operator:helm-chart
    run: once
    requires:
      vars:
        - KIND_CLUSTER_NAME
    vars:
      KIND_HOSTPORT:
        # This command extracts the host port for the control plane of the Kind cluster.
        # Redundant curly braces are used to escape the template syntax in Taskfile.
        sh: docker inspect --format '{{"{{"}} (index (index .HostConfig.PortBindings "6443/tcp") 0).HostPort {{"}}"}}' {{ .KIND_CLUSTER_NAME }}-control-plane
      OPERATOR_IMAGE_REPOSITORY: '{{ .OPERATOR_IMAGE_REPOSITORY | default (printf "%s:%s/klio-operator-testing" .REGISTRY_NAME .REGISTRY_PORT) }}'
      OPERATOR_IMAGE_TAG: '{{ .OPERATOR_IMAGE_TAG | default "dev" }}'
      OPERAND_IMAGE_REPOSITORY: '{{ .OPERAND_IMAGE_REPOSITORY | default (printf "%s:%s/klio-testing" .REGISTRY_NAME .REGISTRY_PORT) }}'
      OPERAND_IMAGE_TAG: '{{ .OPERAND_IMAGE_TAG | default "dev" }}'
      # renovate: datasource=docker depName=alpine/k8s versioning=docker
      ALPINE_K8S_VERSION: 1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
      # TODO: remove the HELM_VERSION once the new alpine/k8s image fixes the issue that caused this PR: https://github.com/cloudnative-pg/klio/pull/57
      # renovate: datasource=github-releases depName=helm/helm versioning=semver
      HELM_VERSION: 'v4.2.4'
      # renovate: datasource=helm depName=cert-manager versioning=semver registryUrl=https://charts.jetstack.io
      CERT_MANAGER_VERSION: 'v1.21.1'
      # Cache busting timestamp to prevent Dagger from caching helm deployments
      CACHE_BUST:
        sh: date +%s
    # TODO: remove the Helm installation once the new alpine/k8s image fixes the issue that caused this PR: https://github.com/cloudnative-pg/klio/pull/57
    cmds:
      - kind get kubeconfig --name {{ .KIND_CLUSTER_NAME }} > {{ .KUBECONFIG_PATH }}
      - |
        dagger shell << "."
        container | from alpine/k8s:{{ .ALPINE_K8S_VERSION }} | with-mounted-file /kube/.config {{ .KUBECONFIG_PATH }} |
        with-directory /chart operator/dist/chart |
        with-exec -- sh -c "curl https://raw.githubusercontent.com/helm/helm/refs/tags/{{ .HELM_VERSION }}/scripts/get-helm-4 | DESIRED_VERSION={{ .HELM_VERSION }} VERIFY_CHECKSUM=false sh" |
        with-env-variable KUBECONFIG /kube/.config |
        with-service-binding localhost tcp://127.0.0.1:{{ .KIND_HOSTPORT }} |
        with-exec -- sh -c "kubectl config set-cluster kind-{{ .KIND_CLUSTER_NAME }} --server=https://localhost:{{ .KIND_HOSTPORT }}" |
        with-exec -- sh -c "helm repo add jetstack https://charts.jetstack.io --force-update" |
        with-exec -- sh -c "helm upgrade -i --wait --create-namespace --namespace cert-manager --version {{ .CERT_MANAGER_VERSION }} --set crds.enabled=true cert-manager jetstack/cert-manager" |
        with-env-variable CACHE_BUST {{ .CACHE_BUST }} |
        with-exec -- sh -c "helm uninstall --wait --ignore-not-found klio -n cnpg-system || true" |
        with-exec -- sh -c "helm upgrade -i --wait --create-namespace --namespace cnpg-system --set controllerManager.manager.image.repository={{ .OPERATOR_IMAGE_REPOSITORY }} --set controllerManager.manager.image.tag={{ .OPERATOR_IMAGE_TAG }} --set controllerManager.manager.env.SIDECAR_IMAGE={{ .OPERAND_IMAGE_REPOSITORY }}:{{ .OPERAND_IMAGE_TAG }} klio /chart"
        .
      - rm -f {{ .KUBECONFIG_PATH }}

  integration:e2e:
    desc: Run the e2e tests
    deps:
      - integration:deploy-to-kind
    run: once
    requires:
      vars:
        - KIND_CLUSTER_NAME
    vars:
      KIND_HOSTPORT:
        # This command extracts the host port for the control plane of the Kind cluster.
        # Redundant curly braces are used to escape the template syntax in Taskfile.
        sh: docker inspect --format '{{"{{"}} (index (index .HostConfig.PortBindings "6443/tcp") 0).HostPort {{"}}"}}' {{ .KIND_CLUSTER_NAME }}-control-plane
      # renovate: datasource=docker depName=golang versioning=docker
      GOLANG_IMAGE_VERSION: 1.27.0-alpine@sha256:4c9fe60190a2a3350ddc51de80d0224b8a6698d12bdfc999fee45ea9d6c46dbc
    cmds:
      - |
        kind get kubeconfig --name {{ .KIND_CLUSTER_NAME }} > {{ .KUBECONFIG_PATH }}
        dagger shell << "."
        container | from golang:{{ .GOLANG_IMAGE_VERSION }} | with-mounted-file /kube/.config {{ .KUBECONFIG_PATH }} |
        with-directory /src/operator operator |
        with-workdir /src/operator/test/e2e |
        with-env-variable KUBECONFIG /kube/.config |
        with-service-binding localhost tcp://127.0.0.1:{{ .KIND_HOSTPORT }} |
        with-exec -- sh -c "apk add kubectl" |
        with-exec -- sh -c "kubectl config set-cluster kind-{{ .KIND_CLUSTER_NAME }} --server=https://localhost:{{ .KIND_HOSTPORT }}" |
        with-exec -- sh -c 'go test -timeout 20m -v ./...; echo $? > /src/operator/test/e2e/e2e_cluster_logs/.exitcode; exit 0' |
        directory /src/operator/test/e2e/e2e_cluster_logs | export ./e2e_cluster_logs
        .
        TEST_EXIT=$(cat ./e2e_cluster_logs/.exitcode 2>/dev/null || echo 1)
        rm -f {{ .KUBECONFIG_PATH }}
        exit $TEST_EXIT

  integration:deploy-to-openshift:
    desc: Deploy the operator + cert-manager + community CNPG on OpenShift via OLM.
    run: once
    requires:
      vars:
        - EXTERNAL_KUBECONFIG
    env:
      KUBECONFIG: '{{ .EXTERNAL_KUBECONFIG }}'
    vars:
      CERT_MANAGER_PACKAGE: 'openshift-cert-manager-operator'
      CERT_MANAGER_CHANNEL: 'stable-v1'
      CNPG_PACKAGE: 'cloudnative-pg'
      CNPG_CHANNEL: 'stable-v1'
      KLIO_PACKAGE: 'klio-operator'
      # opm semver renders 0.x.y bundles into stable-v0; bump on 1.0.0.
      KLIO_CHANNEL: 'stable-v0'
      # SIDECAR_IMAGE is baked into the operator Deployment by the bundle (see
      # the olm:manifest task), so the Subscription does not need to set it.
    preconditions:
      - sh: test -s operator/klio-operator-catalog-source.yaml
        msg: |
          operator/klio-operator-catalog-source.yaml is missing.
          Run `task olm:catalog-source` first (or download the `klio-olm`
          artifact from the ci.yml `olm` job) before invoking this task.
    cmds:
      # Full OpenShift (CRC) already provides OLM, the openshift-marketplace and
      # openshift-operators namespaces (with a global OperatorGroup), the
      # redhat-operators/certified-operators catalogs, the console.openshift.io
      # CRDs, and a cluster pull secret for registry.redhat.io. The Klio
      # operator, bundle, catalog and operand images are all public on ghcr.io,
      # so no additional pull credentials are needed.
      - kubectl apply -f operator/klio-operator-catalog-source.yaml
      - kubectl -n openshift-marketplace wait
          --for=jsonpath='{.status.connectionState.lastObservedState}'=READY
          --timeout=600s
          catalogsource/klio-catalog
      - |
        set -euo pipefail
        # The cluster's global-operators OG (openshift-operators) covers all
        # three Subscriptions. cert-manager and CNPG come from the built-in
        # redhat-operators/certified-operators catalogs.
        cat <<EOF | kubectl apply -f -
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: {{ .CERT_MANAGER_PACKAGE }}
          namespace: openshift-operators
        spec:
          channel: {{ .CERT_MANAGER_CHANNEL }}
          name: {{ .CERT_MANAGER_PACKAGE }}
          source: redhat-operators
          sourceNamespace: openshift-marketplace
          installPlanApproval: Automatic
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: {{ .CNPG_PACKAGE }}
          namespace: openshift-operators
        spec:
          channel: {{ .CNPG_CHANNEL }}
          name: {{ .CNPG_PACKAGE }}
          source: certified-operators
          sourceNamespace: openshift-marketplace
          installPlanApproval: Automatic
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: {{ .KLIO_PACKAGE }}
          namespace: openshift-operators
        spec:
          channel: {{ .KLIO_CHANNEL }}
          name: {{ .KLIO_PACKAGE }}
          source: klio-catalog
          sourceNamespace: openshift-marketplace
          installPlanApproval: Automatic
        EOF
      - |
        set -euo pipefail
        # Re-create the three TLS Issuer+Certificate pairs the OLM bundle strips.
        # OLM hasn't created the cert-manager CRDs yet at this point. Poll the
        # Established condition directly rather than `kubectl wait
        # --for=condition=Established`: that command errors out (instead of
        # waiting) both when a CRD is still NotFound AND when it exists but its
        # .status.conditions is still nil — a race right after OLM creates them
        # ("accessor error: <nil> ... expected []interface{}"). A jsonpath read
        # returns empty in both cases, so we loop until it reports True.
        echo "waiting for cert-manager CRDs to be Established..."
        deadline=$(( $(date +%s) + 300 ))
        for crd in issuers.cert-manager.io certificates.cert-manager.io; do
          until [ "$(kubectl get crd "${crd}" \
            -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' \
            2>/dev/null)" = "True" ]; do
            if (( $(date +%s) >= deadline )); then
              echo "::error::cert-manager CRD ${crd} not Established within 5m"
              kubectl get csv,sub,installplan -n openshift-operators || true
              kubectl get pods -A 2>/dev/null | grep -Ei "imagepull|err|pending" || true
              exit 1
            fi
            sleep 5
          done
        done

        # Wait for the cert-manager workload (CRD validating webhook depends
        # on cert-manager-webhook.cert-manager.svc being Ready).
        kubectl wait --for=create ns/cert-manager --timeout=600s
        kubectl wait --for=create deployment/cert-manager-webhook -n cert-manager --timeout=600s

        echo "waiting for cert-manager-webhook deployment to be Available..."
        kubectl -n cert-manager \
          wait --for=condition=Available deployment/cert-manager-webhook --timeout=10m

        # Wait for the Endpoints to point at the webhook pod (the address-update
        # window can lag the Deployment becoming Available by a beat).
        selector=$(kubectl -n cert-manager get service cert-manager-webhook -o json \
          | jq -r '.spec.selector | to_entries | map("\(.key)=\(.value)") | join(",")')
        pod_ip=$(kubectl -n cert-manager get pod -l "${selector}" \
          -o jsonpath='{.items[0].status.podIP}')
        kubectl wait --for=jsonpath="{.subsets[0].addresses[0].ip}=${pod_ip}" \
          -n cert-manager endpoints/cert-manager-webhook --timeout=60s

        # Wait for cainjector to copy the source CA into the VWC caBundle.
        # The annotation tells us the source Secret (NS/name); we compute the
        # expected base64 value and wait for caBundle to equal it.
        ann=$(kubectl get validatingwebhookconfiguration cert-manager-webhook \
          -o jsonpath='{.metadata.annotations.cert-manager\.io/inject-ca-from-secret}')
        ca_ns="${ann%%/*}"
        ca_sec="${ann##*/}"
        kubectl wait --for=create -n "${ca_ns}" "secret/${ca_sec}" --timeout=300s
        expected_ca=$(kubectl -n "${ca_ns}" get "secret/${ca_sec}" \
          -o jsonpath='{.data.ca\.crt}')
        kubectl wait --for=jsonpath="{.webhooks[0].clientConfig.caBundle}=${expected_ca}" \
          validatingwebhookconfiguration/cert-manager-webhook --timeout=300s

        cat <<'YAML' | kubectl -n openshift-operators apply -f -
        apiVersion: cert-manager.io/v1
        kind: Issuer
        metadata:
          name: klio-operator-selfsigned-issuer
        spec:
          selfSigned: {}
        ---
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: klio-operator-plugin-server
        spec:
          secretName: klio-plugin-server-tls
          dnsNames:
            - klio-operator-plugin
            - klio-operator-plugin.openshift-operators
            - klio-operator-plugin.openshift-operators.svc
            - klio-operator-plugin.openshift-operators.svc.cluster.local
          usages: [server auth]
          issuerRef: {name: klio-operator-selfsigned-issuer, kind: Issuer, group: cert-manager.io}
          duration: 2160h
          renewBefore: 360h
        ---
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: klio-operator-plugin-client
        spec:
          secretName: klio-plugin-client-tls
          commonName: klio-operator-plugin-client
          usages: [client auth]
          issuerRef: {name: klio-operator-selfsigned-issuer, kind: Issuer, group: cert-manager.io}
          duration: 2160h
          renewBefore: 360h
        ---
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: klio-operator-metrics-certs
        spec:
          secretName: klio-metrics-server-cert
          dnsNames:
            - klio-operator-controller-manager-metrics-service.openshift-operators.svc
            - klio-operator-controller-manager-metrics-service.openshift-operators.svc.cluster.local
          issuerRef: {name: klio-operator-selfsigned-issuer, kind: Issuer}
          duration: 2160h
          renewBefore: 360h
        YAML

        kubectl -n openshift-operators wait --for=condition=Ready --timeout=300s \
          certificate/klio-operator-plugin-server \
          certificate/klio-operator-plugin-client \
          certificate/klio-operator-metrics-certs
        echo "all three Klio TLS certificates issued"
      - |
        set -euo pipefail

        # Wait for each Subscription's CSV to reach Succeeded.
        for pkg in {{ .CERT_MANAGER_PACKAGE }} {{ .CNPG_PACKAGE }} {{ .KLIO_PACKAGE }}; do
          label="operators.coreos.com/${pkg}.openshift-operators="
          kubectl wait --for=create -n openshift-operators -l "${label}" csv --timeout=300s
          echo "waiting for ${pkg} CSV to reach Succeeded..."
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded -n openshift-operators \
            -l "${label}" csv --timeout=10m
        done

  integration:write-e2e-config-openshift:
    desc: Generate operator/test/e2e/e2e-config.openshift.yaml for an OpenShift run.
    run: once
    vars:
      OPERAND_IMAGE_REPOSITORY: '{{ .OPERAND_IMAGE_REPOSITORY | default "ghcr.io/cloudnative-pg/klio-testing" }}'
      OPERAND_IMAGE_TAG: '{{ .OPERAND_IMAGE_TAG | default .IMAGE_TAG }}'
      # csi-hostpath-sc is provisioned by setup-crc-csi-hostpath.sh and matches
      # the StorageClass the Kind path uses (allowVolumeExpansion: true).
      STORAGE_CLASS: '{{ .STORAGE_CLASS | default "csi-hostpath-sc" }}'
    cmds:
      - |
        set -euo pipefail
        cat > operator/test/e2e/e2e-config.openshift.yaml <<EOF
        serverImage: "{{ .OPERAND_IMAGE_REPOSITORY }}:{{ .OPERAND_IMAGE_TAG }}"
        logDir: "e2e_cluster_logs"
        storageClass: "{{ .STORAGE_CLASS }}"
        operatorNamespace: "openshift-operators"
        operatorAppLabel: "app.kubernetes.io/name=klio-operator"
        operatorSubscription: "klio-operator"
        EOF

  integration:setup-crc-storage:
    desc: Deploy expandable csi-hostpath storage on a CRC cluster (for PVCResize).
    summary: |
      CRC's default StorageClass is hostPath-backed and cannot expand volumes.
      This deploys the same csi-driver-host-path the Kind path uses so the
      PVCResize e2e feature has an expandable csi-hostpath-sc. Run it whenever
      you have a CRC cluster, in CI or locally (point KUBECONFIG at the cluster
      first).
    run: once
    env:
      # Target the cluster via EXTERNAL_KUBECONFIG when invoked as a dependency
      # of integration:e2e-openshift; fall back to the ambient KUBECONFIG for
      # standalone local runs.
      KUBECONFIG: '{{.EXTERNAL_KUBECONFIG | default .KUBECONFIG}}'
    cmds:
      - bash operator/test/hack/setup-crc-csi-hostpath.sh

  integration:e2e-openshift:
    desc: Run the e2e tests against an OpenShift (CRC) cluster.
    deps:
      - integration:setup-crc-storage
      - integration:write-e2e-config-openshift
      - integration:deploy-to-openshift
    run: once
    requires:
      vars:
        - EXTERNAL_KUBECONFIG
    dir: operator/test/e2e
    env:
      KUBECONFIG: '{{ .EXTERNAL_KUBECONFIG }}'
      # Read the OpenShift config the write-e2e-config-openshift dependency
      # generates, not the default e2e-config.yaml a local Kind run may own.
      # Relative to dir (operator/test/e2e).
      E2E_CONFIG_FILE: e2e-config.openshift.yaml
    cmds:
      # write-e2e-config-openshift (a dependency) generates this; remove it
      # when the run finishes, pass or fail, so it doesn't linger as stale
      # state for the next OpenShift run to trip over.
      - defer: rm -f "${E2E_CONFIG_FILE}"
      - mkdir -p e2e_cluster_logs
      - go test -timeout 30m -v ./...

  renovate:validate:
    desc: Validate the renovate configuration
    run: once
    vars:
      # renovate: datasource=docker depName=renovate/renovate versioning=docker
      RENOVATE_IMAGE_VERSION: 44.39.2@sha256:e6b93e709ca64495ab9307350b260064276ee02d15c6886387fd2d42c926623b
    cmds:
      - >
        dagger core container from --address renovate/renovate:{{ .RENOVATE_IMAGE_VERSION }}
        with-mounted-file --path /config/renovate.json --source ./renovate.json
        with-workdir --path /config
        with-exec --args renovate-config-validator --args "--strict" --args renovate.json
        stdout
    sources:
      - renovate.json

# -- Override the name of the Helm Chart.
nameOverride: klio
# -- Override the fully qualified name of the Helm Chart.
fullnameOverride: ""

controllerManager:
  manager:
    # -- List of command line arguments to pass to the controller manager.
    args:
      - "--metrics-bind-address=:8443"
      - "--leader-elect"
      - "--health-probe-bind-address=:8081"
      - "--plugin-server-cert=/pluginServer/tls.crt"
      - "--plugin-server-key=/pluginServer/tls.key"
      - "--plugin-client-cert=/pluginClient/tls.crt"
      - "--plugin-server-address=:9090"
      - "--custom-cnpg-group=postgresql.cnpg.io"
    # -- The security context for the controller manager container.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      # -- The image to use for the controller manager container.
      repository: ghcr.io/enterprisedb/klio-operator
      # -- The tag to use for the controller manager container image.
      tag: v0.0.11 # x-release-please-version
      # -- The controller manager container imagePullPolicy.
      pullPolicy: Always
      # -- The list of imagePullSecrets.
      pullSecrets: []
    # -- The environment variables to set in the controller manager container.
    env: {
      SIDECAR_IMAGE: "ghcr.io/enterprisedb/klio:v0.0.11" # x-release-please-version
    }
    # -- Liveness probe configuration.
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    # -- Readiness probe configuration.
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    # -- The resources to allocate.
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  # -- Affinity rules for the operator deployment.
  affinity: {}
  # -- The security context for the controller manager pod.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  serviceAccount:
    # -- The annotations to add to the service account.
    annotations: {}
  # -- NodeSelector for the operator deployment.
  nodeSelector: {}
  # -- Priority class name for the controller manager pod.
  priorityClassName: ""
  # -- Tolerations for the operator deployment.
  tolerations: []
  # -- Topology Spread Constraints for the operator deployment.
  topologySpreadConstraints: []

# -- The domain for the Kubernetes cluster.
kubernetesClusterDomain: cluster.local

metricsService:
  # -- Enable the metrics service for the controller manager.
  enable: true
  # -- The port the metrics service will listen on.
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  # -- Service type for the metrics service.
  type: ClusterIP
  # -- The name of the secret containing the TLS certificate for the metrics service.
  metricsServiceSecret: klio-metrics-server-cert

plugin:
  # -- The name the plugin will use to register itself with the CNPG Operator.
  name: klio.cnpg.io
  # -- The Server TLS certificate.
  serverSecret: klio-plugin-server-tls
  # -- The Client TLS certificate.
  clientSecret: klio-plugin-client-tls
  # -- The port the plugin will listen on. It must match the "--plugin-server-address" argument.
  port: 9090

prometheus:
  # -- To enable a ServiceMonitor to export metrics to Prometheus set true.
  enable: true

certmanager:
  # -- Enable cert-manager integration for certificate creation.
  enable: true
  # -- Create certificates for the plugin client.
  createPluginClientCertificate: true
  # -- Create certificates for the plugin server.
  createPluginServerCertificate: true
  # -- Create certificates for the metrics service.
  createMetricsCertificate: true
  # -- The duration of the certificates.
  duration: 2160h
  # -- The renew before time for the certificates.
  renewBefore: 360h
  # -- The DNS domain of the cluster
  clusterDomain: cluster.local

serviceAccount:
  # -- The annotations to add to the service account.
  annotations: {}
  # -- Specifies whether a service account should be created.
  create: true
  # -- The name of the service account
  name: ""
  # -- Automount service account token.
  automount: true

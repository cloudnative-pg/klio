apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    app: klio-plugin
    cnpg.io/pluginName: klio.cnpg.io
  annotations:
    cnpg.io/pluginClientSecret: klio-plugin-client-tls
    cnpg.io/pluginServerSecret: klio-plugin-server-tls
    cnpg.io/pluginPort: "9090"
  name: klio-plugin
spec:
  ports:
    - port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app.kubernetes.io/name: klio-operator

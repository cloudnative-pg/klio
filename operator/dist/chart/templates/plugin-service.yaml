apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "chart.fullname" . }}-plugin
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    cnpg.io/pluginName: {{ .Values.plugin.name }}
  annotations:
    cnpg.io/pluginClientSecret: {{ .Values.plugin.clientSecret }}
    cnpg.io/pluginServerSecret: {{ .Values.plugin.serverSecret }}
    cnpg.io/pluginPort: "{{ .Values.plugin.port }}"
spec:
  ports:
    - port: {{ .Values.plugin.port }}
      protocol: TCP
      targetPort: {{ .Values.plugin.port }}
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager

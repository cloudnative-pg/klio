{{- if .Values.certmanager.enable }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-plugin-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.plugin.clientSecret }}
  commonName: klio-plugin-client
  usages:
    - client auth
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-plugin-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.plugin.serverSecret }}
  dnsNames:
    - klio-plugin
    - klio-plugin.{{ .Release.Namespace }}
    - klio-plugin.{{ .Release.Namespace }}.svc
    - klio-plugin.{{ .Release.Namespace }}.svc.{{ .Values.certmanager.clusterDomain }}
  usages:
    - server auth
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}

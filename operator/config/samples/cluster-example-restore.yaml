apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-restore
spec:
  instances: 3
  logLevel: debug
  imagePullPolicy: Always

  bootstrap:
    recovery:
      source: source

  externalClusters:
    - name: source
      plugin:
        name: klio.cnpg.io
        parameters:
          pluginConfigurationRef: client-config-example-restore

  storage:
    size: 1Gi
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-example-klio-user
spec:
  commonName: klio@cluster-example
  secretName: cluster-example-klio-user

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - client auth

  issuerRef:
    name: server-sample-client-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-example-restore
spec:
  serverAddress: server-sample.default
  clientTlsIdentity:
    volume:
      secret:
        secretName: cluster-example-klio-user
    certPath: tls.crt
    keyPath: tls.key
  serverCa:
    volume:
      secret:
        secretName: server-sample-server-ca
        items:
        - key: ca.crt
          path: ca.crt
    path: ca.crt
  clusterName: cluster-example

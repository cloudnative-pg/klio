---
# PVC for storing generated WAL files
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: walplayer-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# Client certificate for authenticating with the Klio server
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: walplayer-client-cert
spec:
  commonName: klio@walplayer
  secretName: walplayer-client-cert
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  isCA: false
  usages:
    - client auth
  issuerRef:
    name: server-sample-ca
    kind: Issuer
    group: cert-manager.io
---
# ConfigMap with klio client configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: walplayer-config
data:
  klio-config.yaml: |
    client:
      wal:
        address: server-sample.default:52000
        cluster_name: walplayer
        server_cert_path: /certs/server/ca.crt
        client_cert_path: /certs/client/tls.crt
        client_key_path: /certs/client/tls.key
---
# Job to generate and play WAL files
apiVersion: batch/v1
kind: Job
metadata:
  name: walplayer-benchmark
spec:
  template:
    metadata:
      labels:
        app: walplayer
    spec:
      restartPolicy: Never
      initContainers:
        # Generate synthetic WAL files
        - name: generate-wals
          image: registry.dev:5000/klio-testing:dev
          imagePullPolicy: Always
          command:
            - /usr/bin/klio
            - wal-player
            - generate
            - /data
            - --wal-size=16
            - --length=100
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        # Play WAL files to the Klio server
        - name: play-wals
          image: registry.dev:5000/klio-testing:dev
          imagePullPolicy: Always
          command:
            - /usr/bin/klio
            - wal-player
            - play
            - /data
            - --config=/config/klio-config.yaml
            - --jobs=4
            - --block-size=2048
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: server-cert
              mountPath: /certs/server
              readOnly: true
            - name: client-cert
              mountPath: /certs/client
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: walplayer-data
        - name: config
          configMap:
            name: walplayer-config
        - name: server-cert
          secret:
            secretName: server-sample-tls
        - name: client-cert
          secret:
            secretName: walplayer-client-cert

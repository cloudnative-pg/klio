apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-example
spec:
  instances: 3
  imagePullPolicy: Always

  postgresql:
    pg_hba:
      - local replication all peer

  plugins:
    - name: klio.cnpg.io
      enabled: true
      parameters:
        pluginConfigurationRef: client-config-example-plugin

  storage:
    size: 1Gi
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-example-klio-user
spec:
  commonName: klio@cluster-example
  secretName: cluster-example-klio-user

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - client auth

  issuerRef:
    name: server-sample-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-example-plugin
spec:
  serverAddress: server-sample.default
  clientSecretName: cluster-example-klio-user
  serverSecretName: server-sample-tls
  clusterName: cluster-example
  pprof: true
  tier1:
    retention:
      keepAnnual: 1
  tier2:
    enableBackup: true
    retention:
      keepAnnual: 2

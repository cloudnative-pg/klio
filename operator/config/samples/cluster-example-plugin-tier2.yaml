apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-example
spec:
  instances: 3
  imagePullPolicy: Always

  postgresql:
    pg_hba:
      - local replication all peer map=local

  plugins:
    - name: klio.cnpg.io
      enabled: true
      parameters:
        pluginConfigurationRef: client-config-example-plugin

  storage:
    size: 1Gi
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-example-klio-user
spec:
  commonName: klio@cluster-example
  secretName: cluster-example-klio-user

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - client auth

  issuerRef:
    name: server-sample-client-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-example-plugin
spec:
  serverAddress: server-sample.default
  clientIdentity:
    volume:
      secret:
        secretName: cluster-example-klio-user
    certPath: tls.crt
    keyPath: tls.key
  serverCa:
    fileReference:
      volume:
        secret:
          secretName: server-sample-server-ca
          items:
          - key: ca.crt
            path: ca.crt
      path: ca.crt
  clusterName: cluster-example
  pprof: true
  tier1:
    retention:
      keepAnnual: 1
  tier2:
    enableBackup: true
    retention:
      keepAnnual: 2

apiVersion: klio.cnpg.io/v1alpha1
kind: Server
metadata:
  name: server-sample
  annotations:
    klio.cnpg.io/pprof: "true"
spec:
  baseConfiguration:
    adminUser:
      name: server-sample-adm

  cacheConfiguration:
    pvcTemplate:
      resources:
        requests:
          storage: 1Gi
      accessModes:
      - ReadWriteOnce

  dataConfiguration:
    pvcTemplate:
      resources:
        requests:
          storage: 1Gi
      accessModes:
      - ReadWriteOnce

  queueConfiguration:
    image: nats:2
    pvcTemplate:
      resources:
        requests:
          storage: 100Mi
      accessModes:
      - ReadWriteOnce

  password:
    name: server-sample-encryption
    key: password

  tlsSecretName: server-sample-tls
  caSecretName: server-sample-ca

  image: registry.dev:5000/klio-testing:dev
  imagePullPolicy: Always
---
apiVersion: v1
data:
  password: cGlwcG9waXBwbw==
  username: a29waWE=
kind: Secret
metadata:
  name: server-sample-adm
---
apiVersion: v1
data:
  password: dGhpc3Bhc3N3b3Jk
kind: Secret
metadata:
  name: server-sample-encryption
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server-sample-tls
spec:
  secretName: server-sample-tls
  commonName: server-sample
  dnsNames:
    - server-sample
    - server-sample.default
    - server-sample.default.svc

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server-sample-ca
spec:
  commonName: server-sample
  secretName: server-sample-ca

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: true
  usages:
    - cert sign

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: server-sample-ca
spec:
  ca:
    secretName: server-sample-ca

apiVersion: klio.cnpg.io/v1alpha1
kind: Server
metadata:
  name: server-sample
spec:
  baseConfiguration:
    adminUser:
      name: server-sample-adm

  cacheConfiguration:
    pvcTemplate:
      resources:
        requests:
          storage: 1Gi
      accessModes:
      - ReadWriteOnce

  dataConfiguration:
    pvcTemplate:
      resources:
        requests:
          storage: 1Gi
      accessModes:
      - ReadWriteOnce

  password:
    name: server-sample-encryption
    key: password

  tlsSecretName: server-sample-tls
  users:
    name: server-sample-users

  image: klio:dev
  imagePullPolicy: IfNotPresent

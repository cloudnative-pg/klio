apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-dc-b
  namespace: dc-b
spec:
  instances: 3
  imagePullPolicy: Always

  bootstrap:
    recovery:
      source: cluster-dc-a-recovery

  postgresql:
    pg_hba:
      - local replication all peer

  plugins:
    - name: klio.cnpg.io
      enabled: true
      parameters:
        pluginConfigurationRef: client-config-cluster-dc-b

  storage:
    size: 1Gi

  replica:
    self: cluster-dc-b
    primary: cluster-dc-a
    source: cluster-dc-a

  externalClusters:
  - name: cluster-dc-a
    plugin:
      name: klio.cnpg.io
      parameters:
        pluginConfigurationRef: client-config-external-cluster-dc-a

  - name: cluster-dc-a-recovery
    plugin:
      name: klio.cnpg.io
      parameters:
        pluginConfigurationRef: client-config-external-cluster-dc-a-recovery

  - name: cluster-dc-b
    plugin:
      name: klio.cnpg.io
      parameters:
        pluginConfigurationRef: client-config-cluster-dc-b
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-external-cluster-dc-a
  namespace: dc-b
spec:
  serverAddress: klioserver-dc-a.dc-a
  clientSecretName: cluster-dc-a-klio-user-for-dc-b
  serverSecretName: klioserver-dc-a-tls
  clusterName: cluster-dc-a
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-external-cluster-dc-a-recovery
  namespace: dc-b
spec:
  serverAddress: klioserver-dc-a.dc-a
  clientSecretName: cluster-dc-a-klio-user-for-dc-b
  serverSecretName: klioserver-dc-a-tls
  clusterName: cluster-dc-a
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-cluster-dc-b
  namespace: dc-b
spec:
  serverAddress: klioserver-dc-b.dc-b
  clientSecretName: cluster-dc-b-klio-user
  serverSecretName: klioserver-dc-b-tls
  clusterName: cluster-dc-b
---
## Generate client certificate for local cluster in dc-b, using the CA in dc-b.
#apiVersion: cert-manager.io/v1
#kind: Certificate
#metadata:
#  name: cluster-dc-b-klio-user
#  namespace: dc-b
#spec:
#  commonName: klio@cluster-dc-b
#  secretName: cluster-dc-b-klio-user
#
#  duration: 87600h # 10y
#  renewBefore: 78840h # 9y
#
#  isCA: false
#  usages:
#    - client auth
#
#  issuerRef:
#    name: klioserver-dc-b-ca
#    kind: Issuer
#    group: cert-manager.io
---
# Actual secret generated from the above cert-manager Certificate for client auth in dc-b
apiVersion: v1
data:
  ca.crt: 
  tls.crt: 
  tls.key: 
kind: Secret
metadata:
  name: cluster-dc-b-klio-user
  namespace: dc-b
type: kubernetes.io/tls
---
## Generate client certificate for external cluster in dc-a, using the CA in dc-b. The generated certificate
## secret needs to be copied to dc-a namespace to be used by the external cluster configuration.
#apiVersion: cert-manager.io/v1
#kind: Certificate
#metadata:
#  name: cluster-dc-b-klio-user-for-dc-a
#  namespace: dc-b
#spec:
#  commonName: klio@cluster-dc-b
#  secretName: cluster-dc-b-klio-user-for-dc-a
#
#  duration: 87600h # 10y
#  renewBefore: 78840h # 9y
#
#  isCA: false
#  usages:
#    - client auth
#
#  issuerRef:
#    name: klioserver-dc-b-ca
#    kind: Issuer
#    group: cert-manager.io
---
# Actual secret generated by the cluster-dc-b-klio-user cert-manager Certificate in dc-a.
# Copied here.
apiVersion: v1
data:
  ca.crt: 
  tls.crt: 
  tls.key: 
kind: Secret
metadata:
  name: cluster-dc-a-klio-user-for-dc-b
  namespace: dc-b
type: kubernetes.io/tls

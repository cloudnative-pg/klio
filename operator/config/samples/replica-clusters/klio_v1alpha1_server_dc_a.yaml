apiVersion: v1
kind: Namespace
metadata:
  name: dc-a
spec: {}
---
apiVersion: klio.cnpg.io/v1alpha1
kind: Server
metadata:
  name: klioserver-dc-a
  namespace: dc-a
spec:
  tier1:
    encryptionKeyFile:
      volume:
        secret:
          secretName: klioserver-dc-a-encryption
          items:
            - key: encryption-key
              path: encryption-key
      path: encryption-key

    identityFile:
      volume:
        secret:
          secretName: klioserver-dc-a-encryption
      path: secret-key

  storage:
    pvcTemplate:
      resources:
        requests:
          storage: 2Gi
      accessModes:
        - ReadWriteOnce

  serverTlsIdentity:
    volume:
      secret:
        secretName: klioserver-dc-a-tls
    certPath: tls.crt
    keyPath: tls.key
  clientCa:
    volume:
      secret:
        secretName: klioserver-dc-a-ca
        items:
          - key: tls.crt
            path: tls.crt
    path: tls.crt
  image: registry.dev:5000/klio-testing:dev
  imagePullPolicy: Always
---

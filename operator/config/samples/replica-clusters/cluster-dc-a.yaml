apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-dc-a
  namespace: dc-a
spec:
  instances: 3
  imagePullPolicy: Always

  postgresql:
    pg_hba:
      - local replication all peer map=local

  plugins:
    - name: klio.cnpg.io
      enabled: true
      parameters:
        pluginConfigurationRef: client-config-cluster-dc-a

  storage:
    size: 1Gi

  replica:
    self: cluster-dc-a
    primary: cluster-dc-a
    source: cluster-dc-b

  externalClusters:
    - name: cluster-dc-a
      plugin:
        name: klio.cnpg.io
        parameters:
          pluginConfigurationRef: client-config-cluster-dc-a

    - name: cluster-dc-b
      plugin:
        name: klio.cnpg.io
        parameters:
          pluginConfigurationRef: client-config-external-cluster-dc-b
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-cluster-dc-a
  namespace: dc-a
spec:
  serverAddress: klioserver-dc-a.dc-a
  clientSecretName: cluster-dc-a-klio-user
  serverSecretName: klioserver-dc-a-tls
  clusterName: cluster-dc-a
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-external-cluster-dc-b
  namespace: dc-a
spec:
  serverAddress: klioserver-dc-a.dc-b
  clientSecretName: cluster-dc-b-klio-user-for-dc-a
  serverSecretName: klioserver-dc-b-tls
  clusterName: cluster-dc-b
---

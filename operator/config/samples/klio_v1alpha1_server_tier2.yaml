---
# Apply these steps to set up RustFS for Tier 2 testing
# kubectl apply -k operator/config/samples/rustfs
# kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=rustfs --timeout=120s
# kubectl apply -f operator/config/samples/rustfs/rustfs-job-create-bucket.yaml
#
# Then apply the Klio Server with Tier 2 sample
apiVersion: klio.cnpg.io/v1alpha1
kind: Server
metadata:
  name: server-sample
  annotations:
    klio.cnpg.io/pprof: "true"
spec:
  tier1:
    cache:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
        - ReadWriteOnce

    data:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
        - ReadWriteOnce

    encryptionKey:
      name: server-sample-encryption
      key: password

  tier2:
    cache:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
          - ReadWriteOnce
    encryptionKey:
      name: server-sample-encryption
      key: password
    s3:
      prefix: klio
      bucketName: klio-bucket
      endpoint: https://rustfs:9000
      region: us-east-1
      # Use explicit credentials (when not using IAM roles)
      accessKeyId:
        name: rustfs-secret
        key: RUSTFS_ACCESS_KEY
      secretAccessKey:
        name: rustfs-secret
        key: RUSTFS_SECRET_KEY
      customCaBundle:
        name: rustfs-tls
        key: tls.crt

  queue:
    pvcTemplate:
      resources:
        requests:
          storage: 100Mi
      accessModes:
        - ReadWriteOnce

  tlsSecretName: server-sample-tls
  caSecretName: server-sample-ca

  image: registry.dev:5000/klio-testing:dev
  imagePullPolicy: Always
---
apiVersion: v1
data:
  password: dGhpc3Bhc3N3b3Jk
kind: Secret
metadata:
  name: server-sample-encryption
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server-sample-tls
spec:
  secretName: server-sample-tls
  commonName: server-sample
  dnsNames:
    - server-sample
    - server-sample.default
    - server-sample.default.svc

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server-sample-ca
spec:
  commonName: server-sample
  secretName: server-sample-ca

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: true
  usages:
    - cert sign

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: server-sample-ca
spec:
  ca:
    secretName: server-sample-ca

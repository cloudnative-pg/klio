apiVersion: klio.cnpg.io/v1alpha1
kind: Server
metadata:
  name: server-sample
  annotations:
    klio.cnpg.io/pprof: "true"
spec:
  baseConfiguration:
    adminUser:
      name: server-sample-adm

  cacheConfiguration:
    pvcTemplate:
      resources:
        requests:
          storage: 1Gi
      accessModes:
      - ReadWriteOnce

  dataConfiguration:
    pvcTemplate:
      resources:
        requests:
          storage: 1Gi
      accessModes:
      - ReadWriteOnce


  password:
    name: server-sample-encryption
    key: password

  tlsSecretName: server-sample-tls
  users:
    name: server-sample-users

  image: registry.dev:5000/klio-testing:dev
  imagePullPolicy: Always

  template:
    spec:
      containers:
        - name: base
          env: &otel-env-vars
            - name: OTEL_SERVICE_NAME
              value: "klio-base"
            - name: OTEL_RESOURCE_DETECTORS
              value: "telemetry.sdk,host,os.type,process.executable.name"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: "grpc"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "https://simplest-collector:4317"
            - name: OTEL_EXPORTER_OTLP_TRACES_COMPRESSION
              value: "gzip"
            - name: OTEL_EXPORTER_OTLP_TRACES_TIMEOUT
              value: "10000"
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "false"
            - name: OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE
              value: "/otel/ca.crt"
            - name: OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE
              value: "/otel/tls.crt"
            - name: OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY
              value: "/otel/tls.key"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "60000"
            - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
              value: "grpc"
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: "https://simplest-collector:4317"
            - name: OTEL_EXPORTER_OTLP_METRICS_TIMEOUT
              value: "60000"
            - name: OTEL_EXPORTER_OTLP_METRICS_INSECURE
              value: "false"
            - name: OTEL_EXPORTER_OTLP_METRICS_CERTIFICATE
              value: "/otel/ca.crt"
            - name: OTEL_EXPORTER_OTLP_METRICS_CLIENT_CERTIFICATE
              value: "/otel/tls.crt"
            - name: OTEL_EXPORTER_OTLP_METRICS_CLIENT_KEY
              value: "/otel/tls.key"
          volumeMounts:
            - mountPath: /otel
              name: otel
        - name: wal
          env: *otel-env-vars
          volumeMounts:
            - mountPath: /otel
              name: otel
      volumes:
        - name: otel
          projected:
            sources:
              - secret:
                  name: simplest-collector-tls
                  items:
                    - key: ca.crt
                      path: ca.crt
              - secret:
                  name: otel-client-cert
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key

# Certificate for the OpenTelemetry client of the Klio server.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-client-cert
spec:
  secretName: otel-client-cert
  commonName: server-sample
  dnsNames:
    - server-sample
    - server-sample.default
    - server-sample.default.svc

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
# Certificate for the OpenTelemetry Collector.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplest-collector-cert
spec:
  secretName: simplest-collector-tls     # cert-manager will create this Secret
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
  dnsNames:
    - simplest-collector.default.svc.cluster.local
    - simplest-collector.default.svc
    - simplest-collector
---
# OpenTelemetry Collector instance
# This is a very basic configuration that receives OTLP data over gRPC and HTTP,
# processes it with a memory limiter and batch processor, and exports it to
# a debug exporter and Prometheus exporter.
# OpenTelemetry Operator is required to run this:
#   kubectl apply -f https://github.com/open-telemetry/opentelemetry-operator/releases/latest/download/opentelemetry-operator.yaml
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: simplest
spec:
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /etc/otel/certs/tls.crt
              key_file: /etc/otel/certs/tls.key
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /etc/otel/certs/tls.crt
              key_file: /etc/otel/certs/tls.key
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        send_batch_size: 10000
        timeout: 10s

    exporters:
      debug:
        verbosity: detailed
      prometheus:
        endpoint: "0.0.0.0:9464"
      otlp:
        endpoint: jaeger:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [ otlp ]
          processors: [ memory_limiter, batch ]
          exporters: [ debug, otlp ]
        metrics:
          receivers: [ otlp ]
          processors: [ memory_limiter, batch ]
          exporters: [ debug, prometheus ]
        logs:
          receivers: [ otlp ]
          processors: [ memory_limiter, batch ]
          exporters: [ debug ]
  volumeMounts:
    - name: otel-tls
      mountPath: /etc/otel/certs
      readOnly: true
  volumes:
    - name: otel-tls
      secret:
        secretName: simplest-collector-tls

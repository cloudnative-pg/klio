apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-example
spec:
  instances: 3
  imagePullPolicy: Always
  
  postgresql:
    pg_hba:
      - local replication all peer

  plugins:
    - name: klio.cnpg.io
      enabled: true
      parameters:
        pluginConfigurationRef: client-config-example-plugin

  storage:
    size: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: klio-client
data:
  password: cGlwcG9waXBwbw==
  username: a2xpbw==
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-example-plugin
spec:
  serverAddress: server-sample.default
  clientSecretName: klio-client
  serverSecretName: server-sample-tls
  metricsAddressInstance: ":8085"
  metricsAddressSendWal: ":8090"
  pprof: true
  retention:
    keepAnnual: 1

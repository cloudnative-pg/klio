# Exposes the CNPG cluster's own metrics (including cnpg_pg_stat_replication_*,
# which the Grafana dashboard's WAL Replication Lag row reads) to Prometheus.
# See ../../../../../documentation/web/docs/user/grafana-dashboards.md.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-example
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cluster-example
  podMetricsEndpoints:
    - port: metrics
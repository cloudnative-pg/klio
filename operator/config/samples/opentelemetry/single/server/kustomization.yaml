# The Klio server, its self-signed TLS identity, and its own CA/Issuer, as
# their own buildable unit so ../../multi can reuse them (as klio-a,
# klio-b, ...) without duplicating their spec. See ../../multi/team-a for
# how that reuse looks.
resources:
  - server.yaml
  - server_certificate.yaml
  - klio_client_ca.yaml
  - klio_client_ca_issuer.yaml

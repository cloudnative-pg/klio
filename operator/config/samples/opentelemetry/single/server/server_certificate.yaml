# This server's own TLS identity, signed by the root CA (../../base/root_ca.yaml)
# — unrelated to this server's own client-cert CA (klio_ca.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-server
spec:
  secretName: klio-server-tls
  commonName: klio
  dnsNames:
    - klio
    - klio.default
    - klio.default.svc

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth

  issuerRef:
    name: cluster-root-ca
    kind: ClusterIssuer
    group: cert-manager.io

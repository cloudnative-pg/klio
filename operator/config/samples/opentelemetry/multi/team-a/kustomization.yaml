# Instantiates ../../single's Klio server and CNPG cluster a second time,
# as "klio-a"/"cluster-a" in the "default" namespace. Only the fields that
# derive from the resource's own name are patched here; everything else
# (PVC templates, volumes, cert usages/issuerRef, plugin container list...)
# is inherited unchanged from ../../single.
namespace: default
resources:
  - ../../single/server
  - ../../single/cluster
patches:
  - target:
      kind: Server
      name: klio
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a
      - op: replace
        path: /spec/tlsSecretName
        value: klio-a-tls
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: klio-server-a
  - target:
      kind: Certificate
      name: klio-server
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a
      - op: replace
        path: /spec/secretName
        value: klio-a-tls
      - op: replace
        path: /spec/commonName
        value: klio-a
      - op: replace
        path: /spec/dnsNames
        value: [klio-a, klio-a.default, klio-a.default.svc]
  - target:
      kind: Cluster
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-a
      - op: replace
        path: /spec/plugins/0/parameters/pluginConfigurationRef
        value: client-config-cluster-a
  - target:
      kind: PluginConfiguration
      name: client-config-cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: client-config-cluster-a
      - op: replace
        path: /spec/serverAddress
        value: klio-a.default
      - op: replace
        path: /spec/clientSecretName
        value: cluster-a-klio-user
      - op: replace
        path: /spec/serverSecretName
        value: klio-a-tls
      - op: replace
        path: /spec/clusterName
        value: cluster-a
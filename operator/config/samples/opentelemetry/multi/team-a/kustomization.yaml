# Instantiates ../../single's server/cluster as "klio-a"/"cluster-a" in
# "default". Only name-derived fields are patched; the rest, including its
# own CA (klio-a-client-ca), is inherited unchanged.
namespace: default
resources:
  - ../../single/server
  - ../../single/cluster
  - cluster_a_klio_client_auth.yaml
patches:
  - target:
      kind: Server
      name: klio
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a
      - op: replace
        path: /spec/serverTlsIdentity
        value:
          volume:
            secret:
              secretName: klio-a-tls
          certPath: tls.crt
          keyPath: tls.key
      - op: replace
        path: /spec/clientCa
        value:
          volume:
            secret:
              secretName: klio-a-client-ca
              items:
                - key: tls.crt
                  path: tls.crt
          path: tls.crt
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: klio-server-a
  - target:
      kind: Certificate
      name: klio-server
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a
      - op: replace
        path: /spec/secretName
        value: klio-a-tls
      - op: replace
        path: /spec/commonName
        value: klio-a
      - op: replace
        path: /spec/dnsNames
        value: [klio-a, klio-a.default, klio-a.default.svc]
  - target:
      kind: Certificate
      name: klio-client-ca
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a-client-ca
      - op: replace
        path: /spec/secretName
        value: klio-a-client-ca
      - op: replace
        path: /spec/commonName
        value: klio-a-client-ca
  - target:
      kind: Issuer
      name: klio-client-ca
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a-client-ca
      - op: replace
        path: /spec/ca/secretName
        value: klio-a-client-ca
  - target:
      kind: Cluster
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-a
      - op: replace
        path: /spec/plugins/0/parameters/pluginConfigurationRef
        value: client-config-cluster-a
  - target:
      kind: PluginConfiguration
      name: client-config-cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: client-config-cluster-a
      - op: replace
        path: /spec/serverAddress
        value: klio-a.default
      - op: replace
        path: /spec/clientTlsIdentity
        value:
          volume:
            secret:
              secretName: cluster-a-klio-user
          certPath: tls.crt
          keyPath: tls.key
      - op: replace
        path: /spec/serverCa
        value:
          volume:
            secret:
              secretName: klio-a-tls
              items:
              - key: ca.crt
                path: ca.crt
          path: ca.crt
      - op: replace
        path: /spec/clusterName
        value: cluster-a
  - target:
      kind: PodMonitor
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-a
      - op: replace
        path: /spec/selector/matchLabels/cnpg.io~1cluster
        value: cluster-a

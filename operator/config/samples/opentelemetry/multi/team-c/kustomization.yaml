# cluster-c reuses ../../single's Cluster/PluginConfiguration, backed by
# klio-b in "default" (see ../team-a for how the reuse looks). Its client
# certificate (../team-b/cluster_c_klio_client_auth.yaml) arrives via
# kubernetes-reflector. The root CA's public certificate arrives as
# "k8s-cluster-ca" via trust-manager (see
# ../../base/k8s_cluster_ca_bundle.yaml): it verifies both the OTel
# collector and klio-b, whose TLS certificate the root CA signs.
namespace: team-c
resources:
  - namespace.yaml
  - cluster_klio_otel_config.yaml
  - ../../single/cluster
patches:
  - target:
      kind: Cluster
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-c
      - op: replace
        path: /spec/plugins/0/parameters/pluginConfigurationRef
        value: client-config-cluster-c
      - op: replace
        path: /spec/projectedVolumeTemplate/sources/0/secret/name
        value: k8s-cluster-ca
  - target:
      kind: PluginConfiguration
      name: client-config-cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: client-config-cluster-c
      - op: replace
        path: /spec/serverAddress
        value: klio-b.default.svc.cluster.local
      - op: replace
        path: /spec/clientIdentity
        value:
          volume:
            secret:
              secretName: cluster-c-klio-user
          certPath: tls.crt
          keyPath: tls.key
      - op: replace
        path: /spec/serverCa
        value:
          fileReference:
            volume:
              secret:
                secretName: k8s-cluster-ca
                items:
                - key: ca.crt
                  path: ca.crt
            path: ca.crt
      - op: replace
        path: /spec/clusterName
        value: cluster-c
  - target:
      kind: PodMonitor
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-c
      - op: replace
        path: /spec/selector/matchLabels/cnpg.io~1cluster
        value: cluster-c

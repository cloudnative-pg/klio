# cluster-c reuses ../../single's Cluster/PluginConfiguration, backed by
# klio-b in "default" (see ../team-a for how the reuse looks). Its client
# certificate (../team-b/cluster_c_klio_client_auth.yaml) and klio-b's own
# TLS certificate (klio-b-tls) arrive via kubernetes-reflector; the OTel
# collector's trust anchor arrives as "otel-collector-ca" via
# trust-manager (see ../../base/otel_collector_ca_bundle.yaml).
namespace: team-c
resources:
  - namespace.yaml
  - cluster_klio_otel_config.yaml
  - ../../single/cluster
patches:
  - target:
      kind: Cluster
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-c
      - op: replace
        path: /spec/plugins/0/parameters/pluginConfigurationRef
        value: client-config-cluster-c
      - op: replace
        path: /spec/projectedVolumeTemplate/sources/0/secret/name
        value: otel-collector-ca
  - target:
      kind: PluginConfiguration
      name: client-config-cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: client-config-cluster-c
      - op: replace
        path: /spec/serverAddress
        value: klio-b.default.svc.cluster.local
      - op: replace
        path: /spec/clientSecretName
        value: cluster-c-klio-user
      - op: replace
        path: /spec/serverSecretName
        value: klio-b-tls
      - op: replace
        path: /spec/clusterName
        value: cluster-c
  - target:
      kind: PodMonitor
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-c
      - op: replace
        path: /spec/selector/matchLabels/cnpg.io~1cluster
        value: cluster-c

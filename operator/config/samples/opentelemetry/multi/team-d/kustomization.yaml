# klio-a-client-ca (client-cert CA) is generated locally, signed by this
# namespace's own selfsigned-issuer (issuer.yaml); klio-a's own TLS
# identity comes straight from the cluster-wide root CA's ClusterIssuer.
# Only the cluster CA's public certificate ("k8s-cluster-ca") arrives
# from "default", via trust-manager.
#
# Reuses ../../single's Server/Cluster (see ../team-a). The server keeps
# the name "klio-a" (same as ../team-a's) deliberately, colliding
# host_names since a Server's pod name derives from its own name. The
# cluster is "cluster-d".
namespace: team-d
resources:
  - namespace.yaml
  - issuer.yaml
  - klio_encryption.yaml
  - klio_server_otel_config.yaml
  - cluster_klio_otel_config.yaml
  - cluster_d_klio_client_auth.yaml
  - ../../single/server
  - ../../single/cluster
patches:
  - target:
      kind: Server
      name: klio
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a
      - op: replace
        path: /spec/serverIdentity
        value:
          volume:
            secret:
              secretName: klio-a-tls
          certPath: tls.crt
          keyPath: tls.key
      - op: replace
        path: /spec/clientCa
        value:
          fileReference:
            volume:
              secret:
                secretName: klio-a-client-ca
            path: tls.crt
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: klio-server-a-team-d
      - op: replace
        path: /spec/template/spec/volumes/0/projected/sources/0/secret/name
        value: k8s-cluster-ca
  - target:
      kind: Certificate
      name: klio-server
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a
      - op: replace
        path: /spec/secretName
        value: klio-a-tls
      - op: replace
        path: /spec/commonName
        value: klio-a
      - op: replace
        path: /spec/dnsNames
        value: [klio-a, klio-a.team-d, klio-a.team-d.svc]
  - target:
      kind: Certificate
      name: klio-client-ca
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a-client-ca
      - op: replace
        path: /spec/secretName
        value: klio-a-client-ca
      - op: replace
        path: /spec/commonName
        value: klio-a-client-ca
  - target:
      kind: Issuer
      name: klio-client-ca
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-a-client-ca
      - op: replace
        path: /spec/ca/secretName
        value: klio-a-client-ca
  - target:
      kind: Cluster
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-d
      - op: replace
        path: /spec/plugins/0/parameters/pluginConfigurationRef
        value: client-config-cluster-d
      - op: replace
        path: /spec/projectedVolumeTemplate/sources/0/secret/name
        value: k8s-cluster-ca
  - target:
      kind: PluginConfiguration
      name: client-config-cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: client-config-cluster-d
      - op: replace
        path: /spec/serverAddress
        value: klio-a
      - op: replace
        path: /spec/clientIdentity
        value:
          volume:
            secret:
              secretName: cluster-d-klio-user
          certPath: tls.crt
          keyPath: tls.key
      - op: replace
        path: /spec/serverCa
        value:
          fileReference:
            volume:
              secret:
                secretName: k8s-cluster-ca
                items:
                - key: ca.crt
                  path: ca.crt
            path: ca.crt
      - op: replace
        path: /spec/clusterName
        value: cluster-d
  - target:
      kind: PodMonitor
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-d
      - op: replace
        path: /spec/selector/matchLabels/cnpg.io~1cluster
        value: cluster-d

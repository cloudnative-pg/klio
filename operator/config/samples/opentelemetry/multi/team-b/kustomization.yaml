# Instantiates ../../single's server/cluster as "klio-b"/"cluster-b" in
# "default". klio-b is also reached from cluster-c (../team-c), so its
# dnsNames cover both forms, and klio-b-client-ca signs cluster-c's client cert
# too (cluster_c_klio_client_auth.yaml, requested here since that's where
# the Issuer lives, and mirrored into team-c by kubernetes-reflector).
namespace: default
resources:
  - ../../single/server
  - ../../single/cluster
  - cluster_b_klio_client_auth.yaml
  - cluster_c_klio_client_auth.yaml
patches:
  - target:
      kind: Server
      name: klio
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-b
      - op: replace
        path: /spec/serverTlsIdentity
        value:
          volume:
            secret:
              secretName: klio-b-tls
          certPath: tls.crt
          keyPath: tls.key
      - op: replace
        path: /spec/clientCa
        value:
          volume:
            secret:
              secretName: klio-b-client-ca
              items:
                - key: tls.crt
                  path: tls.crt
          path: tls.crt
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: klio-server-b
  - target:
      kind: Certificate
      name: klio-server
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-b
      - op: replace
        path: /spec/secretName
        value: klio-b-tls
      - op: replace
        path: /spec/commonName
        value: klio-b
      - op: replace
        path: /spec/dnsNames
        value:
          [
            klio-b,
            klio-b.default,
            klio-b.default.svc,
            klio-b.default.svc.cluster.local,
          ]
  - target:
      kind: Certificate
      name: klio-client-ca
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-b-client-ca
      - op: replace
        path: /spec/secretName
        value: klio-b-client-ca
      - op: replace
        path: /spec/commonName
        value: klio-b-client-ca
  - target:
      kind: Issuer
      name: klio-client-ca
    patch: |-
      - op: replace
        path: /metadata/name
        value: klio-b-client-ca
      - op: replace
        path: /spec/ca/secretName
        value: klio-b-client-ca
  - target:
      kind: Cluster
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-b
      - op: replace
        path: /spec/plugins/0/parameters/pluginConfigurationRef
        value: client-config-cluster-b
  - target:
      kind: PluginConfiguration
      name: client-config-cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: client-config-cluster-b
      - op: replace
        path: /spec/serverAddress
        value: klio-b.default
      - op: replace
        path: /spec/clientTlsIdentity
        value:
          volume:
            secret:
              secretName: cluster-b-klio-user
          certPath: tls.crt
          keyPath: tls.key
      - op: replace
        path: /spec/serverCa
        value:
          volume:
            secret:
              secretName: klio-b-tls
              items:
              - key: ca.crt
                path: ca.crt
          path: ca.crt
      - op: replace
        path: /spec/clusterName
        value: cluster-b
  - target:
      kind: PodMonitor
      name: cluster-example
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-b
      - op: replace
        path: /spec/selector/matchLabels/cnpg.io~1cluster
        value: cluster-b

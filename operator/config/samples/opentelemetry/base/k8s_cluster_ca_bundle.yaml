# Distributes the k8s cluster CA's public certificate (the root CA that
# signs everything except Klio client certificates) to team-c/team-d as
# the trust anchor for the OTel collector and the Klio server.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: k8s-cluster-ca
spec:
  sources:
    - secret:
        name: cluster-root-ca
        key: tls.crt
  target:
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        klio.cnpg.io/trust-k8s-cluster-ca: "true"

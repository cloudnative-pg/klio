# Distributes the root CA's public certificate to team-c/team-d as the
# trust anchor for the OTel collector's (CA-issued) certificate.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: otel-collector-ca
spec:
  sources:
    - secret:
        name: cluster-root-ca
        key: tls.crt
  target:
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        klio.cnpg.io/trust-otel-collector-ca: "true"

apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rustfs-aws-cli-client
          image: amazon/aws-cli:2.39.1@sha256:3517c17b5f01637df3b6184a4280fbcc36e4ea38105954cade628ff17bb9a7b9
          command: ["/bin/sh", "-c"]
          args:
            - |
              aws s3 mb s3://klio-bucket --endpoint-url https://rustfs:9000 --no-verify-ssl
          env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: rustfs-secret
                key: RUSTFS_ACCESS_KEY
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: rustfs-secret
                key: RUSTFS_SECRET_KEY
          - name: AWS_CA_BUNDLE
            value: /certs/ca.crt
          volumeMounts:
          - name: certs
            mountPath: /certs/ca.crt
            subPath: ca.crt
            readOnly: true
          resources:
            limits:
              memory: 256Mi
      volumes:
      - name: certs
        secret:
          secretName: rustfs-tls
          items:
          - key: tls.crt
            path: ca.crt
      restartPolicy: OnFailure
  backoffLimit: 4

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-a-klio-user
spec:
  commonName: klio@cluster-a
  secretName: cluster-a-klio-user

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - client auth

  issuerRef:
    name: klio-server-ca
    kind: Issuer
    group: cert-manager.io

# Reuses the name "klio-a" (see ../klio_server_a.yaml in "default"). Its
# StatefulSet pod is therefore also named "klio-a-klio-0", identical to the
# original klio-a's host_name -- see team-e/README note in ../README.md.
apiVersion: klio.cnpg.io/v1alpha1
kind: Server
metadata:
  name: klio-a
  namespace: team-e
spec:
  queue:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
        - ReadWriteOnce
  tier1:
    cache:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
        - ReadWriteOnce

    data:
      pvcTemplate:
        resources:
          requests:
            storage: 1Gi
        accessModes:
        - ReadWriteOnce

    encryptionKeyFile:
      fileReference:
        volume:
          secret:
            secretName: klio-encryption
        path: encryption-key

    identityFile:
      fileReference:
        volume:
          secret:
            secretName: klio-encryption
        path: secret-key

  caSecretName: klio-server-ca
  tlsSecretName: klio-a-tls

  image: registry.dev:5000/klio-testing:dev
  imagePullPolicy: Always

  template:
    spec:
      containers:
        - name: server
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_SERVICE_NAME
              value: "klio-server-a-team-e"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.node.name=$(NODE_NAME),k8s.pod.uid=$(POD_UID)"
          envFrom:
            - configMapRef:
                name: klio-server-otel-config
          volumeMounts:
            - mountPath: /otel
              name: otel
      volumes:
        - name: otel
          projected:
            sources:
              - secret:
                  name: otel-collector-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
              - secret:
                  name: klio-server-otel-client-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key

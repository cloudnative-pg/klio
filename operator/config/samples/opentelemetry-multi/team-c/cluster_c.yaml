# cluster-c is backed by klio-b, which lives in the "default" namespace, not
# here. This exercises a single Klio server serving clusters from more than
# one namespace. serverSecretName/clientSecretName/the OTel client secret
# below are NOT created by this file: they are copied in from "default" by
# ../copy-cross-namespace-secrets.sh, which must be run before applying this
# kustomization.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-c
  namespace: team-c
spec:
  instances: 3
  imagePullPolicy: Always

  projectedVolumeTemplate:
    sources:
      - secret:
          name: otel-collector-ca
          items:
            - key: ca.crt
              path: ca.crt
      - secret:
          name: klio-server-otel-client-tls
          items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key

  postgresql:
    pg_hba:
      - local replication all peer map=local

  plugins:
    - name: klio.cnpg.io
      enabled: true
      parameters:
        pluginConfigurationRef: client-config-cluster-c

  storage:
    size: 1Gi
---
apiVersion: klio.cnpg.io/v1alpha1
kind: PluginConfiguration
metadata:
  name: client-config-cluster-c
  namespace: team-c
spec:
  serverAddress: klio-b.default.svc.cluster.local
  clientSecretName: cluster-c-klio-user
  serverSecretName: klio-b-tls
  clusterName: cluster-c
  containers:
    - name: klio-plugin
      env:
        - name: OTEL_SERVICE_NAME
          value: "klio-plugin"
      envFrom:
        - configMapRef:
            name: cluster-klio-otel-config
    - name: klio-restore
      env:
        - name: OTEL_SERVICE_NAME
          value: "klio-restore"
      envFrom:
        - configMapRef:
            name: cluster-klio-otel-config

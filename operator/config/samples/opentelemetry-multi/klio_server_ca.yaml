# Root CA shared by both Klio servers (klio-a, klio-b) in this sample, and by
# the cross-namespace client certificate generated for cluster-c (see
# ../copy-cross-namespace-secrets.sh). Sharing a single CA lets any client
# certificate it signs be trusted by either server's caSecretName.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-server-ca
spec:
  commonName: klio-server
  secretName: klio-server-ca

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: true
  usages:
    - cert sign

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io

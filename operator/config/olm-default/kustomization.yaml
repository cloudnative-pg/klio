apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: operator-system
resources:
- ../default
- plugin_service.yaml

# Bake the Klio sidecar (operand) image into the operator Deployment as the
# SIDECAR_IMAGE env var, so OLM Subscriptions do not need to set it. The patch
# is generated (with the right image) by the `olm:manifest` task and is git
# ignored.
patches:
- path: manager_sidecar_image_patch.yaml
  target:
    kind: Deployment
# Mark the plugin cert volumes optional so the pod starts on OLM (no
# cert-manager); see plugin_certs_optional_patch.yaml for details.
- path: plugin_certs_optional_patch.yaml


# These resources constitute the fully configured set of manifests
# used to generate the 'manifests/' directory in a bundle.
resources:
- bases/klio-operator.clusterserviceversion.yaml
- ../olm-default
- ../samples
- ../scorecard

# Point the CSV's containerImage annotation at the operator image actually
# being built. The patch is generated (with the right image) by the
# `olm:manifest` task and is git ignored.
patches:
- path: csv_container_image_patch.yaml
  target:
    kind: ClusterServiceVersion
# Declare which already-released versions this bundle can be installed over,
# as olm.skipRange. Also generated by `olm:manifest` and git ignored; see the
# task for why a single-bundle catalog needs it.
- path: csv_skip_range_patch.yaml
  target:
    kind: ClusterServiceVersion
# Point the sample Server at the operand image actually being built, rather
# than the local dev registry the committed sample uses. Also generated by
# `olm:manifest` and git ignored.
- path: sample_image_patch.yaml
  target:
    group: klio.cnpg.io
    version: v1alpha1
    kind: Server
# Keep the sample's example encryption Secret out of the bundle; see the patch
# for why.
- path: remove_sample_secret.yaml


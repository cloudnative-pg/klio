apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Database
    containerImage: ghcr.io/cloudnative-pg/klio-operator:latest
    createdAt:
    description: Enterprise-grade backup and recovery manager for PostgreSQL
      clusters managed by CloudNativePG on Kubernetes.
    repository: https://github.com/cloudnative-pg/klio
    support: EnterpriseDB
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
  name: klio-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: Server is the Schema for the Klio backup server API. It
        manages a StatefulSet running the Klio server together with the
        PersistentVolumeClaims that back the cache, the data catalog, and
        the task queue, and wires the server to the TLS material used for
        client authentication.
      displayName: Klio Server
      kind: Server
      name: servers.klio.cnpg.io
      resources:
      - kind: StatefulSet
        name: ""
        version: v1
      - kind: Service
        name: ""
        version: v1
      - kind: PersistentVolumeClaim
        name: ""
        version: v1
      - kind: Secret
        name: ""
        version: v1
      specDescriptors:
      - description: Container image used for the Klio server.
        displayName: Server Image
        path: image
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Policy for pulling the Klio server image.
        displayName: Image Pull Policy
        path: imagePullPolicy
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:imagePullPolicy
      - description: Secrets used to pull the server image from private registries.

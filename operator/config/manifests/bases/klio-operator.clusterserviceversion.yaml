  description: |
    # Klio — EDB Postgres Backup & Recovery Manager for CloudNativePG

    **Klio** is an enterprise-grade backup and recovery manager for
    PostgreSQL databases on Kubernetes. It integrates natively with
    [CloudNativePG](https://cloudnative-pg.io) through a CNPG-I plugin
    and stores backup artifacts across two distinct storage tiers:

    * **Tier 1 — Local Volume.** A local Persistent Volume within the
      same namespace as the PostgreSQL `Cluster`, offering immediate,
      high-throughput access for backup and recovery operations.
    * **Tier 2 — Secondary Storage.** An external, S3-compatible object
      storage system where data from Tier 1 is asynchronously replicated
      for geographical redundancy and disaster recovery.

    ## Features

    * Native WAL streaming from the primary, removing the need for
      `archive_command`, with support for partial WAL file handling,
      compression, and user-provided encryption keys.
    * Physical online base backups with deduplication, compression, and
      encryption, stored in a Tier 1 PVC catalog.
    * Retention policy enforcement for both base backups and WAL files.
    * Asynchronous replication of base backups and WAL files to Tier 2
      object storage.
    * End-to-end encryption, both in transit (TLS) and at rest.
    * Integration with Kubernetes Volume Snapshots when the underlying
      storage class supports them.

    Klio requires **PostgreSQL 15 or newer** because its WAL management
    uses the `READ_REPLICATION_SLOT` streaming replication command
    introduced in that release.

    ## Prerequisites

    * A CloudNativePG installation in the target cluster.
    * A cert-manager installation, or an equivalent way of provisioning
      TLS certificates for the Klio server and its clients.
    * Persistent Volume Claims that support `ReadWriteOnce`.

    ## Getting started

    Full installation and configuration instructions are available in
    the [official documentation](https://enterprisedb.github.io/klio).

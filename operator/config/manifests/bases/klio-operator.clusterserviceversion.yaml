      - description: Number of weekly Tier 2 backups to keep.
        displayName: Tier 2 Keep Weekly
        path: tier2.retention.keepWeekly
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: Number of monthly Tier 2 backups to keep.
        displayName: Tier 2 Keep Monthly
        path: tier2.retention.keepMonthly
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: Number of annual Tier 2 backups to keep.
        displayName: Tier 2 Keep Annual
        path: tier2.retention.keepAnnual
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: WAL prefetching settings applied during recovery.

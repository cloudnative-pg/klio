# The sample Server ships alongside an example encryption Secret, so that
# applying config/samples/klio_v1alpha1_server.yaml works in a single step
# locally. Secret is an OLM-supported bundle kind, so operator-sdk copies it
# into bundle/manifests/ and OLM would create it on every install of the
# operator: we do not need the example in the bundle
apiVersion: v1
kind: Secret
metadata:
  name: server-sample-encryption
$patch: delete

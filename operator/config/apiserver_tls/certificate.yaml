apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: klio-api
spec:
  secretName: klio-api-tls
  commonName: klio-api
  dnsNames:
    - klio-api
    - klio-api.default
    - klio-api.default.svc

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth
    - client auth

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
